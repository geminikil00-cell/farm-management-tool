            {view === 'units' ? (<div className="space-y-8"><div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">{irrigationUnits.map(unit => (<div key={unit.id} className="bg-white rounded-xl border shadow-sm p-6 flex flex-col justify-between h-64"><div><div className="flex items-center justify-between mb-2"><div className="flex items-center gap-2 text-cyan-700"><Droplets className="w-6 h-6"/><h3 className="font-bold text-lg">{unit.name}</h3></div><button onClick={() => handleDeleteUnit(unit.id)} className="p-1 hover:bg-red-50 rounded text-red-500 hover:text-red-700" title="Delete unit"><Trash2 className="w-4 h-4" /></button></div><p className="text-sm text-slate-500 mb-4">Connected to <strong className="text-slate-800">{unit.connectedPlots.length}</strong> plots</p></div><div className="space-y-2"><button onClick={() => openConnectionModal(unit.id)} className="w-full py-2 border rounded-lg text-sm font-bold text-slate-600 hover:bg-slate-50">Edit Connection</button><button onClick={() => openEntryModal(unit.id)} className="w-full py-2 bg-cyan-600 text-white rounded-lg text-sm font-bold hover:bg-cyan-700 shadow-sm" disabled={unit.connectedPlots.length===0}>Log Irrigation</button></div></div>))}</div><div className="bg-white rounded-xl border overflow-hidden"><div className="p-4 bg-slate-50 border-b font-bold">Recent Logs</div><div className="max-h-60 overflow-y-auto"><table className="w-full text-sm text-left"><thead className="bg-slate-50 sticky top-0"><tr><th className="p-3">Date</th><th className="p-3">Unit</th><th className="p-3">Material</th><th className="p-3">Water</th><th className="p-3">Plots</th><th className="p-3">Actions</th></tr></thead><tbody>{irrigationRecords.map(r => <tr key={r.id} className="border-t hover:bg-slate-50"><td className="p-3">{r.date}</td><td className="p-3 font-bold">{r.unitName}</td><td className="p-3">{r.materialName} ({r.quantity})</td><td className="p-3">{r.water}L</td><td className="p-3 truncate max-w-xs">{r.appliedTo.length}</td><td className="p-3 flex gap-2"><button onClick={()=>openEntryModal(r.unitId, r)}><Edit2 className="w-4 h-4 text-indigo-500"/></button><button onClick={()=>handleDeleteRecord(r.id)}><Trash2 className="w-4 h-4 text-red-500"/></button></td></tr>)}</tbody></table></div></div></div>) : (<div className="space-y-6">{renderLocationSection("Greenhouses", "greenhouse")}{renderLocationSection("Nurseries", "nursery")}{renderLocationSection("Open Fields", "field")}</div>)}{isConnectionModalOpen && <div className="fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4"><div className="bg-white rounded-xl shadow-xl w-full max-w-2xl p-6 flex flex-col max-h-[80vh]"><h3 className="font-bold text-lg mb-4">Edit Connections: {irrigationUnits.find(u=>u.id===activeUnit)?.name}</h3><div className="flex-1 overflow-y-auto p-1 border rounded bg-slate-50"><div className="p-2 space-y-4">{renderLocationSection("Greenhouses", "greenhouse", true)}{renderLocationSection("Nurseries", "nursery", true)}{renderLocationSection("Open Fields", "field", true)}</div></div><div className="flex justify-end gap-2 pt-4"><button onClick={() => setIsConnectionModalOpen(false)} className="px-4 py-2 border rounded">Cancel</button><button onClick={saveConnections} className="px-4 py-2 bg-blue-600 text-white rounded">Confirm</button></div></div></div>}{isEntryModalOpen && <div className="fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4"><div className="bg-white rounded-xl shadow-xl w-full max-w-md p-6"><h3 className="font-bold mb-4">{editingId ? 'Edit' : 'New'} Irrigation Log</h3><form onSubmit={handleEntrySubmit} className="space-y-4"><div><label className="block text-sm">Date</label><input type="date" value={formData.date} onChange={e=>setFormData({...formData, date:e.target.value})} className="w-full border p-2 rounded" required/></div><div><label className="block text-sm">Material</label><select value={formData.materialId} onChange={e=>setFormData({...formData, materialId:e.target.value})} className="w-full border p-2 rounded" required><option value="" disabled>Select...</option>{validMaterials.map(m=><option key={m.id} value={m.id}>{m.name} ({m.quantity})</option>)}</select></div><div><label className="block text-sm">Quantity</label><input type="number" value={formData.quantity} onChange={e=>setFormData({...formData, quantity:e.target.value})} className="w-full border p-2 rounded" required/></div><div><label className="block text-sm">Water (L)</label><input type="number" value={formData.water} onChange={e=>setFormData({...formData, water:e.target.value})} className="w-full border p-2 rounded" required/></div><div className="flex justify-end gap-2 pt-2"><button type="button" onClick={()=>setIsEntryModalOpen(false)} className="px-4 py-2 border rounded">Cancel</button><button type="submit" className="px-4 py-2 bg-cyan-600 text-white rounded">Confirm</button></div></form></div></div>}{selectedBlockHistory && <div className="fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4"><div className="bg-white rounded-xl shadow-xl w-full max-w-4xl p-6 max-h-[90vh] flex flex-col animate-fade-in-up"><div className="flex justify-between items-center mb-4 border-b pb-2"><h3 className="font-bold text-xl capitalize text-slate-800">{selectedBlockHistory.id.replace('-', ' ')} Irrigation Analytics</h3><button onClick={() => setSelectedBlockHistory(null)}><X className="w-6 h-6"/></button></div><div className="flex-1 overflow-y-auto space-y-6 pr-2"><div className="grid grid-cols-2 md:grid-cols-4 gap-4"><div className="bg-cyan-50 p-4 rounded-xl border border-cyan-100"><p className="text-xs font-bold text-cyan-600 uppercase">Total Water</p><p className="text-2xl font-bold text-slate-800">{selectedBlockHistory.stats.totalWater.toLocaleString()} L</p></div><div className="bg-blue-50 p-4 rounded-xl border border-blue-100"><p className="text-xs font-bold text-blue-600 uppercase">Events</p><p className="text-2xl font-bold text-slate-800">{selectedBlockHistory.stats.count}</p></div><div className="bg-indigo-50 p-4 rounded-xl border border-indigo-100"><p className="text-xs font-bold text-indigo-600 uppercase">Primary Input</p><p className="text-lg font-bold text-slate-800 truncate">{selectedBlockHistory.stats.mostUsedMat}</p></div><div className="bg-green-50 p-4 rounded-xl border border-green-100"><p className="text-xs font-bold text-green-600 uppercase">Last Event</p><p className="text-lg font-bold text-slate-800">{selectedBlockHistory.stats.lastDate}</p></div></div><div className="grid grid-cols-1 md:grid-cols-2 gap-6"><div className="bg-white border rounded-xl p-4 shadow-sm"><h4 className="text-sm font-bold text-slate-700 mb-4 border-b pb-2">Water Volume Trend</h4><SVGBarChart data={selectedBlockHistory.charts.waterTrend} /></div><div className="bg-white border rounded-xl p-4 shadow-sm"><h4 className="text-sm font-bold text-slate-700 mb-4 border-b pb-2">Input Distribution</h4><SVGDonutChart data={selectedBlockHistory.charts.donutData} /><div className="mt-4 grid grid-cols-2 gap-2 text-xs">{selectedBlockHistory.charts.donutData.map((d, i) => (<div key={i} className="flex justify-between border-b pb-1"><span>{d.label}</span><span className="font-bold">{d.value}</span></div>))}</div></div></div><div><h4 className="text-sm font-bold text-slate-700 mb-2">History Log</h4><div className="border rounded-lg overflow-hidden"><table className="w-full text-xs text-left"><thead className="bg-slate-50 border-b"><tr><th className="p-2">Date</th><th className="p-2">Unit</th><th className="p-2">Water</th><th className="p-2">Input</th></tr></thead><tbody>{selectedBlockHistory.records.map(r => (<tr key={r.id} className="border-b last:border-0 hover:bg-slate-50"><td className="p-2">{r.date}</td><td className="p-2">{r.unitName}</td><td className="p-2 font-bold text-cyan-600">{r.water}L</td><td className="p-2 text-slate-600">{r.materialName} ({r.quantity})</td></tr>))}</tbody></table></div></div></div></div></div>}</div>);
        };

        // Statistical Data Manager - Deep Analytics Engine
        const StatisticalDataManager = ({ plots, addPlot, deletePlot, plantingRecords, harvestRecords, materials, getCycleBreakdown, nurseryRecords, sprayingRecords, irrigationRecords }) => {
            const [activeTab, setActiveTab] = useState('overview');
            const [selectedPlot, setSelectedPlot] = useState(null);
            const [selectedCycles, setSelectedCycles] = useState([]);
            const [showFactorDetail, setShowFactorDetail] = useState(null);
            const [selectedYear, setSelectedYear] = useState('all');
            const [aiInsights, setAiInsights] = useState(null);
            const [aiLoading, setAiLoading] = useState(false);
            const greenhouses = plots.filter(p => p.type === 'Greenhouse');
            const fields = plots.filter(p => p.type === 'Open Field');
            
            // Get available years from data
            const availableYears = useMemo(() => {
                const years = new Set();
                plantingRecords.forEach(r => r.year && years.add(r.year));
                harvestRecords.forEach(r => r.year && years.add(r.year));
                return Array.from(years).sort((a, b) => b - a);
            }, [plantingRecords, harvestRecords]);
            
            // ==================== CORE METRICS ENGINE ====================
            const getAllCyclesWithMetrics = useMemo(() => {
                const allCycles = [];
                let uniqueIdx = 0;
                plots.forEach(plot => {
                    const displayId = plot.plotId || plot.plotDisplayId || plot.id;
                    const plotKey = `${plot.type === 'Greenhouse' ? 'greenhouse' : 'field'}-${displayId}`;
                    const pRecs = plantingRecords.filter(r => r.plotKey === plotKey);
                    const hRecs = harvestRecords.filter(r => r.plotKey === plotKey);
                    const cycles = {};
                    
                    // Build cycles from planting records
                    pRecs.forEach(p => {
                        const cycleKey = `${plotKey}-${p.year || 0}-${p.cycle || 0}`;
                        if(!cycles[cycleKey]) {
                            uniqueIdx++;
                            cycles[cycleKey] = { 
                                id: `cycle-${uniqueIdx}-${plotKey}-${p.year || 0}-${p.cycle || 0}`,
                                plotKey, plotName: plot.name, plotType: plot.type,
                                year: p.year || 0, cycle: p.cycle || 0, start: p.date, 
                                planted: 0, seedlingCost: 0, varieties: new Set(), nurseryBatches: []
                            };
                        }
                        cycles[cycleKey].planted += p.quantity;
                        cycles[cycleKey].varieties.add(p.variety);
                        const nurseryBatch = nurseryRecords.find(n => n.id === p.nurseryBatchId);
                        if(nurseryBatch) {
                            cycles[cycleKey].nurseryBatches.push(nurseryBatch);
                            cycles[cycleKey].seedlingCost += (p.quantity * (nurseryBatch.costPerSeedling || 0));
                        }
                        if(new Date(p.date) < new Date(cycles[cycleKey].start)) cycles[cycleKey].start = p.date;
                    });
                    
                    // Enrich with harvest data
                    hRecs.forEach(h => {
                        const cycleKey = `${plotKey}-${h.year || 0}-${h.cycle || 0}`;
                        if(!cycles[cycleKey]) return;
                        if(!cycles[cycleKey].end || new Date(h.date) > new Date(cycles[cycleKey].end)) cycles[cycleKey].end = h.date;
                        cycles[cycleKey].harvestedHeads = (cycles[cycleKey].harvestedHeads || 0) + h.totalHeads;
                        cycles[cycleKey].harvestedWeight = (cycles[cycleKey].harvestedWeight || 0) + h.weight;
                        cycles[cycleKey].revenue = (cycles[cycleKey].revenue || 0) + (h.revenue || 0);
                        cycles[cycleKey].pkgCost = (cycles[cycleKey].pkgCost || 0) + (h.packagingCost || 0);
                    });
                    
                    // Calculate extended metrics for each cycle
                    Object.values(cycles).forEach(c => {
                        const endDate = c.end || new Date().toISOString().split('T')[0];
                        const startD = new Date(c.start);
                        const endD = new Date(endDate);
                        const durationDays = Math.max(1, Math.ceil((endD - startD) / (1000*60*60*24)));
                        const ops = getCycleBreakdown(c.plotKey, c.start, endDate);
                        
                        // Get spray events for this cycle
                        const cycleSprayEvents = sprayingRecords?.filter(r => {
                            const rDate = new Date(r.date);
                            return rDate >= startD && rDate <= endD && r.locations?.includes(c.plotKey);
                        }) || [];
                        const sprayCount = cycleSprayEvents.length;
                        const sprayFrequency = durationDays > 0 ? (sprayCount / durationDays * 7).toFixed(2) : 0; // per week
                        
                        // Get irrigation events for this cycle
                        const cycleIrrEvents = irrigationRecords?.filter(r => {
                            const rDate = new Date(r.date);
                            return rDate >= startD && rDate <= endD && r.appliedTo?.includes(c.plotKey);
                        }) || [];
                        const irrCount = cycleIrrEvents.length;
                        const totalWaterLiters = cycleIrrEvents.reduce((sum, r) => sum + (Number(r.water) / (r.appliedTo?.length || 1)), 0) +
                            cycleSprayEvents.reduce((sum, r) => sum + (Number(r.water) / (r.locations?.length || 1)), 0);
                        
                        const totalCost = c.seedlingCost + ops.water + ops.spray + ops.irrMat + (c.pkgCost || 0);
                        const weight = c.harvestedWeight || 0;
                        const revenue = c.revenue || 0;
                        const heads = c.harvestedHeads || 0;
                        const profit = revenue - totalCost;
                        
                        // Efficiency metrics
                        const survivalRate = c.planted > 0 ? (heads / c.planted * 100) : 0;
                        const yieldPerPlant = c.planted > 0 ? (weight / c.planted) : 0;
                        const revenuePerPlant = c.planted > 0 ? (revenue / c.planted) : 0;
                        const profitPerPlant = c.planted > 0 ? (profit / c.planted) : 0;
                        const roi = totalCost > 0 ? ((profit / totalCost) * 100) : 0;
                        const avgHeadWeight = heads > 0 ? (weight / heads) : 0;
                        const costPerKg = weight > 0 ? (totalCost / weight) : 0;
                        const profitPerKg = weight > 0 ? (profit / weight) : 0;
                        const waterEfficiency = totalWaterLiters > 0 ? (weight / totalWaterLiters * 1000) : 0; // kg per 1000L
                        const growthRate = durationDays > 0 ? (weight / durationDays) : 0; // kg per day
                        
                        allCycles.push({
                            ...c,
                            varieties: Array.from(c.varieties).join(', '),
                            end: c.end || 'Active',
                            isActive: !c.end,
                            durationDays, ops, totalCost, weight, revenue, heads, profit,
                            survivalRate, yieldPerPlant, revenuePerPlant, profitPerPlant,
                            roi, avgHeadWeight, costPerKg, profitPerKg,
                            waterEfficiency, growthRate, sprayCount, sprayFrequency,
                            irrCount, totalWaterLiters
                        });
                    });
                });
                return allCycles.sort((a,b) => b.year - a.year || b.cycle - a.cycle);
            }, [plots, plantingRecords, harvestRecords, nurseryRecords, sprayingRecords, irrigationRecords, getCycleBreakdown]);
            
            // Filter only completed cycles for analysis, with year filter
            const completedCycles = useMemo(() => {
                const cycles = getAllCyclesWithMetrics.filter(c => !c.isActive && c.weight > 0);
                if (selectedYear === 'all') return cycles;
                return cycles.filter(c => c.year === parseInt(selectedYear));
            }, [getAllCyclesWithMetrics, selectedYear]);
            
            // ==================== SCORING SYSTEM ====================
            const calculateCycleScores = useMemo(() => {
                if(completedCycles.length === 0) return [];
                
                // Calculate benchmarks (averages)
                const benchmarks = {
                    profitPerKg: completedCycles.reduce((s,c) => s + c.profitPerKg, 0) / completedCycles.length,
                    survivalRate: completedCycles.reduce((s,c) => s + c.survivalRate, 0) / completedCycles.length,
                    avgHeadWeight: completedCycles.reduce((s,c) => s + c.avgHeadWeight, 0) / completedCycles.length,
                    roi: completedCycles.reduce((s,c) => s + c.roi, 0) / completedCycles.length,
                    waterEfficiency: completedCycles.reduce((s,c) => s + c.waterEfficiency, 0) / completedCycles.length,
                    costPerKg: completedCycles.reduce((s,c) => s + c.costPerKg, 0) / completedCycles.length
                };
                
                // Score each cycle (0-100 scale)
                return completedCycles.map(c => {
                    const scores = {
                        profitability: Math.min(100, Math.max(0, 50 + (c.profitPerKg - benchmarks.profitPerKg) * 20)),
                        survival: Math.min(100, c.survivalRate),
                        quality: Math.min(100, Math.max(0, (c.avgHeadWeight / Math.max(benchmarks.avgHeadWeight, 0.01)) * 50)),
                        efficiency: Math.min(100, Math.max(0, 50 + (benchmarks.costPerKg - c.costPerKg) * 10)),
                        water: Math.min(100, Math.max(0, (c.waterEfficiency / Math.max(benchmarks.waterEfficiency, 0.01)) * 50)),
                        roi: Math.min(100, Math.max(0, 50 + c.roi / 2))
                    };
                    const overallScore = (scores.profitability * 0.3 + scores.survival * 0.2 + scores.quality * 0.15 + 
                                         scores.efficiency * 0.2 + scores.water * 0.05 + scores.roi * 0.1);
                    return { ...c, scores, overallScore, benchmarks };
                }).sort((a,b) => b.overallScore - a.overallScore);
            }, [completedCycles]);
            
            // ==================== FACTOR ANALYSIS ====================
            const factorAnalysis = useMemo(() => {
                if(calculateCycleScores.length < 3) return null;
                
                const topPerformers = calculateCycleScores.slice(0, Math.max(1, Math.ceil(calculateCycleScores.length * 0.25)));
                const bottomPerformers = calculateCycleScores.slice(-Math.max(1, Math.ceil(calculateCycleScores.length * 0.25)));
                
                const avgTop = (arr, key) => arr.reduce((s,c) => s + (c[key] || 0), 0) / arr.length;
                const avgBot = (arr, key) => arr.reduce((s,c) => s + (c[key] || 0), 0) / arr.length;
                
                const factors = [
                    { name: 'Spray Frequency', key: 'sprayFrequency', unit: '/week', topAvg: avgTop(topPerformers, 'sprayFrequency'), botAvg: avgBot(bottomPerformers, 'sprayFrequency'), icon: '🧪' },
                    { name: 'Irrigation Events', key: 'irrCount', unit: ' events', topAvg: avgTop(topPerformers, 'irrCount'), botAvg: avgBot(bottomPerformers, 'irrCount'), icon: '💧' },
                    { name: 'Water Volume', key: 'totalWaterLiters', unit: 'L', topAvg: avgTop(topPerformers, 'totalWaterLiters'), botAvg: avgBot(bottomPerformers, 'totalWaterLiters'), icon: '🌊' },
                    { name: 'Seedling Cost', key: 'seedlingCost', unit: '$', topAvg: avgTop(topPerformers, 'seedlingCost'), botAvg: avgBot(bottomPerformers, 'seedlingCost'), icon: '🌱' },
                    { name: 'Cycle Duration', key: 'durationDays', unit: ' days', topAvg: avgTop(topPerformers, 'durationDays'), botAvg: avgBot(bottomPerformers, 'durationDays'), icon: '📅' },
                    { name: 'Plants Count', key: 'planted', unit: ' plants', topAvg: avgTop(topPerformers, 'planted'), botAvg: avgBot(bottomPerformers, 'planted'), icon: '🌿' },
                    { name: 'Spray Cost', key: 'ops.spray', unit: '$', topAvg: topPerformers.reduce((s,c) => s + c.ops.spray, 0) / topPerformers.length, botAvg: bottomPerformers.reduce((s,c) => s + c.ops.spray, 0) / bottomPerformers.length, icon: '💊' },
                    { name: 'Irrigation Cost', key: 'ops.irrMat', unit: '$', topAvg: topPerformers.reduce((s,c) => s + c.ops.irrMat, 0) / topPerformers.length, botAvg: bottomPerformers.reduce((s,c) => s + c.ops.irrMat, 0) / bottomPerformers.length, icon: '🚿' }
                ].map(f => {
                    const diff = f.topAvg - f.botAvg;
                    const diffPercent = f.botAvg !== 0 ? ((diff / f.botAvg) * 100) : (diff > 0 ? 100 : 0);
                    const impact = Math.abs(diffPercent) > 30 ? 'high' : Math.abs(diffPercent) > 10 ? 'medium' : 'low';
                    return { ...f, diff, diffPercent, impact };
                });
                
                return { topPerformers, bottomPerformers, factors: factors.sort((a,b) => Math.abs(b.diffPercent) - Math.abs(a.diffPercent)) };
            }, [calculateCycleScores]);
            
            // ==================== PLOT AGGREGATED STATS ====================
            const plotStats = useMemo(() => {
                const byPlot = {};
                completedCycles.forEach(c => {
                    if(!byPlot[c.plotKey]) byPlot[c.plotKey] = { 
                        plotKey: c.plotKey, plotName: c.plotName, plotType: c.plotType, cycles: [],
                        totalRevenue: 0, totalProfit: 0, totalWeight: 0, totalCost: 0
                    };
                    byPlot[c.plotKey].cycles.push(c);
                    byPlot[c.plotKey].totalRevenue += c.revenue;
                    byPlot[c.plotKey].totalProfit += c.profit;
                    byPlot[c.plotKey].totalWeight += c.weight;
                    byPlot[c.plotKey].totalCost += c.totalCost;
                });
                return Object.values(byPlot).map(p => ({
                    ...p,
                    cycleCount: p.cycles.length,
                    avgProfitPerKg: p.totalWeight > 0 ? (p.totalProfit / p.totalWeight) : 0,
                    avgSurvivalRate: p.cycles.reduce((s,c) => s + c.survivalRate, 0) / p.cycles.length,
                    avgROI: p.cycles.reduce((s,c) => s + c.roi, 0) / p.cycles.length,
                    consistency: p.cycles.length > 1 ? 
                        (1 - (Math.sqrt(p.cycles.reduce((s,c) => s + Math.pow(c.profitPerKg - (p.totalProfit/p.totalWeight), 2), 0) / p.cycles.length) / 
                        Math.max(Math.abs(p.totalProfit/p.totalWeight), 1))) * 100 : 50
                })).sort((a,b) => b.avgProfitPerKg - a.avgProfitPerKg);
            }, [completedCycles]);
            
            // ==================== INSIGHTS GENERATION ====================
            const insights = useMemo(() => {
                const list = [];
                if(calculateCycleScores.length === 0) return [{ type: 'info', icon: '📊', title: 'No Data Yet', message: 'Complete some harvest cycles to see insights and recommendations.' }];
                
                // Best performing cycle
                const best = calculateCycleScores[0];
                if(best) list.push({ type: 'success', icon: '🏆', title: 'Top Performer', message: `${best.plotName} (Y${best.year}-C${best.cycle}) achieved ${best.profitPerKg.toFixed(2)}/kg profit with ${best.survivalRate.toFixed(0)}% survival.` });
                
                // Factor insights
                if(factorAnalysis) {
                    const topFactor = factorAnalysis.factors[0];
                    if(topFactor && Math.abs(topFactor.diffPercent) > 15) {
                        const direction = topFactor.diff > 0 ? 'higher' : 'lower';
                        list.push({ type: 'insight', icon: '💡', title: `Key Difference: ${topFactor.name}`, message: `Top performers have ${Math.abs(topFactor.diffPercent).toFixed(0)}% ${direction} ${topFactor.name.toLowerCase()} than underperformers.` });
                    }
                }
                
                // Survival rate insight
                const lowSurvival = completedCycles.filter(c => c.survivalRate < 70);
                if(lowSurvival.length > 0) {
                    list.push({ type: 'warning', icon: '⚠️', title: 'High Mortality Alert', message: `${lowSurvival.length} cycle(s) had survival rates below 70%. Check seedling quality and pest management.` });
                }
                
                // Best plot recommendation
                if(plotStats.length > 0) {
                    const bestPlot = plotStats[0];
                    list.push({ type: 'recommendation', icon: '🎯', title: 'Focus Recommendation', message: `${bestPlot.plotName} is your most profitable plot at $${bestPlot.avgProfitPerKg.toFixed(2)}/kg. Consider prioritizing this location.` });
                }
                
                // Water efficiency insight
                const avgWaterEff = completedCycles.reduce((s,c) => s + c.waterEfficiency, 0) / completedCycles.length;
                const bestWaterCycle = completedCycles.reduce((best, c) => c.waterEfficiency > (best?.waterEfficiency || 0) ? c : best, null);
                if(bestWaterCycle && bestWaterCycle.waterEfficiency > avgWaterEff * 1.3) {
                    list.push({ type: 'insight', icon: '💧', title: 'Water Efficiency Champion', message: `${bestWaterCycle.plotName} (Y${bestWaterCycle.year}-C${bestWaterCycle.cycle}) achieved ${bestWaterCycle.waterEfficiency.toFixed(1)} kg/1000L - ${((bestWaterCycle.waterEfficiency/avgWaterEff - 1)*100).toFixed(0)}% above average.` });
                }
                
                // ROI insight
                const highROI = completedCycles.filter(c => c.roi > 100);
                if(highROI.length > 0) {
                    list.push({ type: 'success', icon: '📈', title: 'Excellent Returns', message: `${highROI.length} cycle(s) achieved over 100% ROI. Your best cycle had ${Math.max(...highROI.map(c => c.roi)).toFixed(0)}% return.` });
                }
                
                return list;
            }, [calculateCycleScores, factorAnalysis, plotStats, completedCycles]);
            
            // ==================== RENDER COMPONENTS ====================
            const ScoreBadge = ({ score, size = 'md' }) => {
                const bg = score >= 70 ? 'bg-emerald-500' : score >= 50 ? 'bg-amber-500' : 'bg-red-500';
                const sz = size === 'lg' ? 'w-14 h-14 text-lg' : 'w-10 h-10 text-sm';
                return <div className={`${bg} ${sz} rounded-full flex items-center justify-center text-white font-bold shadow-lg`}>{score.toFixed(0)}</div>;
            };
            
            const FactorBar = ({ factor }) => {
                const pct = Math.min(100, Math.max(-100, factor.diffPercent));
                const isPositive = factor.diff > 0;
                return (
                    <div className="mb-4 p-3 bg-slate-50 rounded-lg hover:bg-slate-100 transition-all cursor-pointer" onClick={() => setShowFactorDetail(factor)}>
                        <div className="flex justify-between items-center mb-2">
                            <span className="font-medium text-slate-700 flex items-center gap-2"><span>{factor.icon}</span>{factor.name}</span>
                            <span className={`text-xs font-bold px-2 py-1 rounded ${factor.impact === 'high' ? 'bg-red-100 text-red-700' : factor.impact === 'medium' ? 'bg-amber-100 text-amber-700' : 'bg-slate-200 text-slate-600'}`}>{factor.impact.toUpperCase()} IMPACT</span>
                        </div>
                        <div className="flex items-center gap-4 text-xs">
                            <div className="flex-1">
                                <div className="flex justify-between mb-1"><span className="text-slate-500">Bottom</span><span className="font-bold">{factor.botAvg.toFixed(1)}{factor.unit}</span></div>
                                <div className="h-2 bg-red-200 rounded-full overflow-hidden"><div className="h-full bg-red-400 rounded-full" style={{width: '100%'}}></div></div>
                            </div>
                            <div className={`px-2 py-1 rounded font-bold ${isPositive ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-100 text-blue-700'}`}>
                                {isPositive ? '+' : ''}{pct.toFixed(0)}%
                            </div>
                            <div className="flex-1">
                                <div className="flex justify-between mb-1"><span className="text-slate-500">Top</span><span className="font-bold">{factor.topAvg.toFixed(1)}{factor.unit}</span></div>
                                <div className="h-2 bg-emerald-200 rounded-full overflow-hidden"><div className="h-full bg-emerald-400 rounded-full" style={{width: '100%'}}></div></div>
                            </div>
                        </div>
                    </div>
                );
            };
            
            const CycleCompareCard = ({ cycle, rank, isSelected, onToggle }) => {
                const borderColor = rank === 1 ? 'border-amber-400 bg-amber-50' : rank === 2 ? 'border-slate-300 bg-slate-50' : rank === 3 ? 'border-orange-300 bg-orange-50' : 'border-slate-200';
                return (
                    <div className={`border-2 ${borderColor} rounded-xl p-4 transition-all ${isSelected ? 'ring-2 ring-blue-500' : ''} hover:shadow-md cursor-pointer`} onClick={onToggle}>
                        <div className="flex justify-between items-start mb-3">
                            <div>
                                <div className="flex items-center gap-2">
                                    {rank <= 3 && <span className="text-lg">{rank === 1 ? '🥇' : rank === 2 ? '🥈' : '🥉'}</span>}
                                    <span className="font-bold text-slate-800">{cycle.plotName}</span>
                                </div>
                                <span className="text-xs text-slate-500">Y{cycle.year}-C{cycle.cycle} • {cycle.varieties}</span>
                            </div>
                            <ScoreBadge score={cycle.overallScore} />
                        </div>
                        <div className="grid grid-cols-3 gap-2 text-xs">
                            <div className="text-center p-2 bg-white rounded"><span className="block text-slate-500">Profit/kg</span><span className={`font-bold ${cycle.profitPerKg >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>${cycle.profitPerKg.toFixed(2)}</span></div>
                            <div className="text-center p-2 bg-white rounded"><span className="block text-slate-500">Survival</span><span className="font-bold text-blue-600">{cycle.survivalRate.toFixed(0)}%</span></div>
                            <div className="text-center p-2 bg-white rounded"><span className="block text-slate-500">ROI</span><span className={`font-bold ${cycle.roi >= 0 ? 'text-purple-600' : 'text-red-600'}`}>{cycle.roi.toFixed(0)}%</span></div>
                        </div>
                        {isSelected && <div className="mt-2 text-center text-xs text-blue-600 font-medium">✓ Selected for comparison</div>}
                    </div>
                );
            };
            
            // ==================== TAB VIEWS ====================
            const renderOverview = () => (
                <div className="space-y-6">
                    {/* Global KPIs */}
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        <StatCard title="Total Cycles" value={completedCycles.length} subtitle={`${getAllCyclesWithMetrics.filter(c => c.isActive).length} active`} icon={BarChart3} color="blue" />
                        <StatCard title="Avg Profit/kg" value={`$${completedCycles.length > 0 ? (completedCycles.reduce((s,c) => s + c.profitPerKg, 0) / completedCycles.length).toFixed(2) : '0.00'}`} subtitle="Farm average" icon={DollarSign} color="emerald" />
                        <StatCard title="Avg Survival" value={`${completedCycles.length > 0 ? (completedCycles.reduce((s,c) => s + c.survivalRate, 0) / completedCycles.length).toFixed(0) : 0}%`} subtitle="Plant survival rate" icon={Sprout} color="purple" />
                        <StatCard title="Avg ROI" value={`${completedCycles.length > 0 ? (completedCycles.reduce((s,c) => s + c.roi, 0) / completedCycles.length).toFixed(0) : 0}%`} subtitle="Return on investment" icon={PieChart} color="amber" />
                    </div>
                    
                    {/* Insights Panel */}
                    <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                        <div className="bg-gradient-to-r from-indigo-600 to-purple-600 px-6 py-4">
                            <h3 className="font-bold text-lg text-white flex items-center gap-2">💡 Key Insights & Recommendations</h3>
                        </div>
                        <div className="p-6">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {insights.map((insight, i) => {
                                    const bgColors = {
                                        'success': 'bg-emerald-50 border-emerald-200',
                                        'warning': 'bg-amber-50 border-amber-200',
                                        'recommendation': 'bg-blue-50 border-blue-200',
                                        'insight': 'bg-indigo-50 border-indigo-200',
                                        'info': 'bg-slate-50 border-slate-200'
                                    };
                                    const textColors = {
                                        'success': 'text-emerald-700',
                                        'warning': 'text-amber-700',
                                        'recommendation': 'text-blue-700',
                                        'insight': 'text-indigo-700',
                                        'info': 'text-slate-700'
                                    };
                                    return (
                                        <div key={i} className={`p-4 rounded-lg border-2 ${bgColors[insight.type] || bgColors.info} transition-all hover:shadow-md`}>
                                            <div className="flex items-start gap-3">
                                                <span className="text-2xl flex-shrink-0">{insight.icon}</span>
                                                <div className="flex-1">
                                                    <p className={`font-bold text-sm mb-1 ${textColors[insight.type] || textColors.info}`}>{insight.title}</p>
                                                    <p className="text-xs text-slate-600 leading-relaxed">{insight.message}</p>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                    
                    {/* Plot Performance Heatmap */}
                    <div className="bg-white rounded-xl border p-6 shadow-sm">
                        <h3 className="font-bold text-lg mb-4 flex items-center gap-2"><LayoutGrid className="w-5 h-5 text-slate-500"/> Plot Performance Ranking</h3>
                        {plotStats.length === 0 ? <p className="text-slate-400 text-center py-8">Complete cycles to see plot rankings</p> : 
                        <div className="space-y-3">
                            {plotStats.map((p, i) => (
                                <div key={p.plotKey} className="flex items-center gap-4 p-3 rounded-lg hover:bg-slate-50 cursor-pointer" onClick={() => {
                                    const foundPlot = plots.find(pl => {
                                        const plDisplayId = pl.plotId || pl.plotDisplayId || pl.id;
                                        return `${pl.type === 'Greenhouse' ? 'greenhouse' : 'field'}-${plDisplayId}` === p.plotKey;
                                    });
                                    if (foundPlot) setSelectedPlot(foundPlot);
                                }}>
                                    <span className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold ${i === 0 ? 'bg-amber-100 text-amber-700' : i === 1 ? 'bg-slate-100 text-slate-600' : i === 2 ? 'bg-orange-100 text-orange-600' : 'bg-slate-50 text-slate-500'}`}>{i + 1}</span>
                                    <div className="flex-1">
                                        <div className="flex justify-between items-center">
                                            <span className="font-bold text-slate-800">{p.plotName}</span>
                                            <span className="text-sm font-bold text-emerald-600">${p.avgProfitPerKg.toFixed(2)}/kg</span>
                                        </div>
                                        <div className="flex gap-4 text-xs text-slate-500 mt-1">
                                            <span>{p.cycleCount} cycles</span>
                                            <span>{p.avgSurvivalRate.toFixed(0)}% survival</span>
                                            <span>{p.avgROI.toFixed(0)}% ROI</span>
                                            <span className={`${p.consistency >= 70 ? 'text-emerald-600' : p.consistency >= 40 ? 'text-amber-600' : 'text-red-600'}`}>{p.consistency.toFixed(0)}% consistency</span>
                                        </div>
                                        <ProgressBar value={p.avgProfitPerKg} max={plotStats[0]?.avgProfitPerKg || 1} color="emerald" showPercent={false} />
                                    </div>
                                </div>
                            ))}
                        </div>}
                    </div>
                    
                    {/* Top/Bottom Performers */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-white rounded-xl border p-6 shadow-sm">
                            <h4 className="font-bold text-slate-700 mb-4 flex items-center gap-2">🏆 Top 5 Cycles</h4>
                            {calculateCycleScores.slice(0, 5).map((c, i) => (
                                <div key={c.id} className="flex items-center gap-3 py-2 border-b last:border-0">
                                    <ScoreBadge score={c.overallScore} size="sm" />
                                    <div className="flex-1"><p className="font-medium text-sm">{c.plotName} Y{c.year}-C{c.cycle}</p><p className="text-xs text-slate-500">${c.profitPerKg.toFixed(2)}/kg • {c.survivalRate.toFixed(0)}% survival</p></div>
                                </div>
                            ))}
                        </div>
                        <div className="bg-white rounded-xl border p-6 shadow-sm">
                            <h4 className="font-bold text-slate-700 mb-4 flex items-center gap-2">📉 Bottom 5 Cycles (Needs Attention)</h4>
                            {calculateCycleScores.slice(-5).reverse().map((c, i) => (
                                <div key={c.id} className="flex items-center gap-3 py-2 border-b last:border-0">
                                    <ScoreBadge score={c.overallScore} size="sm" />
                                    <div className="flex-1"><p className="font-medium text-sm">{c.plotName} Y{c.year}-C{c.cycle}</p><p className="text-xs text-slate-500">${c.profitPerKg.toFixed(2)}/kg • {c.survivalRate.toFixed(0)}% survival</p></div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
            
            const renderCycleComparison = () => (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <div>
                            <h3 className="font-bold text-lg text-slate-800">Cycle-by-Cycle Comparison</h3>
                            <p className="text-sm text-slate-500">Select up to 4 cycles to compare side-by-side</p>
                        </div>
                        {selectedCycles.length > 0 && <button onClick={() => setSelectedCycles([])} className="text-sm text-red-600 hover:underline">Clear Selection</button>}
                    </div>
                    
                    {/* Cycle Cards Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                        {calculateCycleScores.map((c, i) => (
                            <CycleCompareCard key={c.id} cycle={c} rank={i + 1} 
                                isSelected={selectedCycles.includes(c.id)}
                                onToggle={() => setSelectedCycles(prev => prev.includes(c.id) ? prev.filter(x => x !== c.id) : prev.length < 4 ? [...prev, c.id] : prev)} />
                        ))}
                    </div>
                    
                    {/* Comparison Table */}
                    {selectedCycles.length >= 2 && (
                        <div className="bg-white rounded-xl border p-6 shadow-sm overflow-x-auto">
                            <h4 className="font-bold text-slate-800 mb-4">Side-by-Side Comparison</h4>
                            <table className="w-full text-sm">
                                <thead className="bg-slate-50">
                                    <tr>
                                        <th className="p-3 text-left font-bold">Metric</th>
                                        {selectedCycles.map(id => {
                                            const c = calculateCycleScores.find(x => x.id === id);
                                            return <th key={id} className="p-3 text-center font-bold">{c?.plotName}<br/><span className="text-xs font-normal text-slate-500">Y{c?.year}-C{c?.cycle}</span></th>;
                                        })}
                                    </tr>
                                </thead>
                                <tbody className="divide-y">
                                    {[
                                        { label: 'Overall Score', key: 'overallScore', format: v => v.toFixed(0), unit: '' },
                                        { label: 'Profit/kg', key: 'profitPerKg', format: v => `$${v.toFixed(2)}`, highlight: true },
                                        { label: 'Survival Rate', key: 'survivalRate', format: v => `${v.toFixed(0)}%` },
                                        { label: 'Avg Head Weight', key: 'avgHeadWeight', format: v => `${v.toFixed(3)} kg` },
                                        { label: 'Total Cost', key: 'totalCost', format: v => `$${v.toFixed(0)}` },
                                        { label: 'Cost/kg', key: 'costPerKg', format: v => `$${v.toFixed(2)}` },
                                        { label: 'ROI', key: 'roi', format: v => `${v.toFixed(0)}%` },
                                        { label: 'Duration', key: 'durationDays', format: v => `${v} days` },
                                        { label: 'Spray Events', key: 'sprayCount', format: v => v },
                                        { label: 'Irrigation Events', key: 'irrCount', format: v => v },
                                        { label: 'Water Used', key: 'totalWaterLiters', format: v => `${v.toFixed(0)} L` },
                                        { label: 'Water Efficiency', key: 'waterEfficiency', format: v => `${v.toFixed(1)} kg/1000L` },
                                        { label: 'Seedling Cost', key: 'seedlingCost', format: v => `$${v.toFixed(0)}` },
                                        { label: 'Spray Cost', key: 'ops.spray', format: v => `$${v.toFixed(0)}`, nested: true },
                                        { label: 'Irrigation Cost', key: 'ops.irrMat', format: v => `$${v.toFixed(0)}`, nested: true }
                                    ].map(row => {
                                        const values = selectedCycles.map(id => {
                                            const c = calculateCycleScores.find(x => x.id === id);
                                            return row.nested ? c?.ops?.[row.key.split('.')[1]] : c?.[row.key];
                                        });
                                        const max = Math.max(...values);
                                        const min = Math.min(...values);
                                        return (
                                            <tr key={row.key} className={row.highlight ? 'bg-emerald-50' : ''}>
                                                <td className="p-3 font-medium">{row.label}</td>
                                                {values.map((v, i) => (
                                                    <td key={i} className={`p-3 text-center ${v === max && values.filter(x => x === max).length === 1 ? 'text-emerald-600 font-bold' : v === min && values.filter(x => x === min).length === 1 ? 'text-red-500' : ''}`}>
                                                        {row.format(v || 0)}
                                                        {v === max && values.filter(x => x === max).length === 1 && <span className="ml-1 text-xs">👑</span>}
                                                    </td>
                                                ))}
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
            );
            
            // Load saved AI insights (only for StatisticalDataManager)
            useEffect(() => {
                const unsub = window.Firebase.onSnapshot('aiInsights', (data) => {
                    const sorted = data.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
                    if (sorted.length > 0) {
                        setAiInsights(sorted[0]);
                    }
                });
                return () => unsub && unsub();
            }, []);
            
            const handleAIAnalysis = async () => {
                if (calculateCycleScores.length < 3) {
                    alert('Need at least 3 completed cycles for AI analysis');
                    return;
                }
                
                setAiLoading(true);
                try {
                    const analysis = await window.GeminiAPI.analyzeFarmData(calculateCycleScores);
                    
                    // Save to Firebase
                    const insightData = {
                        analysis,
                        cycleCount: calculateCycleScores.length,
                        year: selectedYear,
                        createdAt: new Date().toISOString()
                    };
                    await window.Firebase.addDoc('aiInsights', insightData);
                    
                    setAiInsights(insightData);
                    alert('AI Analysis completed successfully!');
                } catch (error) {
                    console.error('AI Analysis Error:', error);
                    alert('Error generating AI analysis: ' + error.message);
                } finally {
                    setAiLoading(false);
                }
            };
            
            const renderFactorAnalysis = () => (
                <div className="space-y-6">
                    <div className="bg-gradient-to-r from-indigo-600 to-purple-600 rounded-xl p-6 text-white">
                        <div className="flex justify-between items-start flex-wrap gap-4">
                            <div>
                                <h3 className="font-bold text-xl mb-2">🔬 Factor Analysis: What Makes a Cycle Successful?</h3>
                                <p className="text-white/80 text-sm">Comparing top 25% performers vs bottom 25% to identify key difference makers</p>
                            </div>
                            <button 
                                onClick={handleAIAnalysis}
                                disabled={aiLoading || calculateCycleScores.length < 3}
                                className="bg-white text-indigo-600 px-4 py-2 rounded-lg font-medium hover:bg-indigo-50 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
                            >
                                {aiLoading ? (
                                    <>
                                        <div className="animate-spin rounded-full h-4 w-4 border-b-2 border-indigo-600"></div>
                                        Analyzing...
                                    </>
                                ) : (
                                    <>
                                        🤖 Generate AI Insights
                                    </>
                                )}
                            </button>
                        </div>
                    </div>
                    
                    {/* AI Insights Display */}
                    {aiInsights && (
                        <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                            <div className="bg-gradient-to-r from-purple-600 to-pink-600 px-6 py-4">
                                <div className="flex justify-between items-center">
                                    <h3 className="font-bold text-lg text-white flex items-center gap-2">🤖 AI-Powered Analysis</h3>
                                    <span className="text-xs text-white/80">{aiInsights.createdAt ? new Date(aiInsights.createdAt).toLocaleDateString() : 'Recent'}</span>
                                </div>
                            </div>
                            <div className="p-6">
                                <div className="prose prose-sm max-w-none">
                                    <div className="whitespace-pre-wrap text-slate-700 leading-relaxed" dangerouslySetInnerHTML={{__html: aiInsights.analysis.replace(/\n/g, '<br/>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\*(.*?)\*/g, '<em>$1</em>')}} />
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {!factorAnalysis ? (
                        <div className="bg-white rounded-xl border p-12 text-center">
                            <p className="text-slate-400">Need at least 3 completed cycles for factor analysis</p>
                        </div>
                    ) : (
                        <>
                            {/* High Impact Factors */}
                            <div className="bg-white rounded-xl border p-6 shadow-sm">
                                <h4 className="font-bold text-slate-800 mb-4 flex items-center gap-2">🎯 Key Difference Makers</h4>
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                    {factorAnalysis.factors.filter(f => f.impact === 'high').map(f => <FactorBar key={f.key} factor={f} />)}
                                </div>
                                {factorAnalysis.factors.filter(f => f.impact === 'high').length === 0 && 
                                    <p className="text-slate-400 text-center py-4">No high-impact factors detected. Top and bottom performers have similar input profiles.</p>}
                            </div>
                            
                            {/* All Factors */}
                            <div className="bg-white rounded-xl border p-6 shadow-sm">
                                <h4 className="font-bold text-slate-800 mb-4">📊 All Factors Analyzed</h4>
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                    {factorAnalysis.factors.map(f => <FactorBar key={f.key} factor={f} />)}
                                </div>
                            </div>
                            
                            {/* Visual Comparison */}
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                <div className="bg-white rounded-xl border p-6 shadow-sm">
                                    <h4 className="font-bold text-emerald-700 mb-4">✨ Top Performers Profile</h4>
                                    <div className="space-y-3">
                                        {factorAnalysis.topPerformers.slice(0, 3).map(c => (
                                            <div key={c.id} className="flex items-center gap-3 p-3 bg-emerald-50 rounded-lg">
                                                <ScoreBadge score={c.overallScore} size="sm" />
                                                <div><p className="font-medium text-sm">{c.plotName} Y{c.year}-C{c.cycle}</p>
                                                <p className="text-xs text-slate-500">Spray: {c.sprayCount}x • Water: {c.totalWaterLiters.toFixed(0)}L • Duration: {c.durationDays}d</p></div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="bg-white rounded-xl border p-6 shadow-sm">
                                    <h4 className="font-bold text-red-700 mb-4">⚠️ Bottom Performers Profile</h4>
                                    <div className="space-y-3">
                                        {factorAnalysis.bottomPerformers.slice(0, 3).map(c => (
                                            <div key={c.id} className="flex items-center gap-3 p-3 bg-red-50 rounded-lg">
                                                <ScoreBadge score={c.overallScore} size="sm" />
                                                <div><p className="font-medium text-sm">{c.plotName} Y{c.year}-C{c.cycle}</p>
                                                <p className="text-xs text-slate-500">Spray: {c.sprayCount}x • Water: {c.totalWaterLiters.toFixed(0)}L • Duration: {c.durationDays}d</p></div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </>
                    )}
                </div>
            );
            
            const renderPlotAnalysis = () => (
                <div className="space-y-6">
                    {/* Add Plot Buttons */}
                    <div className="flex justify-between items-center">
                        <h3 className="font-bold text-lg text-slate-800">Plot Deep Analysis</h3>
                        <div className="flex gap-2">
                            <button onClick={() => addPlot('Greenhouse')} className="bg-emerald-600 text-white px-4 py-2 rounded-lg flex gap-2 hover:bg-emerald-700 shadow-sm text-sm"><Plus className="w-4 h-4" /> Add Greenhouse</button>
                            <button onClick={() => addPlot('Open Field')} className="bg-amber-600 text-white px-4 py-2 rounded-lg flex gap-2 hover:bg-amber-700 shadow-sm text-sm"><Plus className="w-4 h-4" /> Add Open Field</button>
                        </div>
                    </div>
                    
                    {/* Farm Map */}
                    <div className="bg-white p-6 rounded-xl border shadow-sm">
                        <h4 className="text-sm font-bold text-slate-500 uppercase mb-4">Greenhouses ({greenhouses.length})</h4>
                        {greenhouses.length === 0 ? <div className="p-4 border border-dashed rounded text-center text-slate-400">No Greenhouses</div> : 
                        <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-4 mb-6">
                            {greenhouses.map(p => {
                                const displayId = p.plotId || p.plotDisplayId || p.id;
                                const pKey = `greenhouse-${displayId}`;
                                const stats = plotStats.find(x => x.plotKey === pKey);
                                const profitColor = !stats ? 'bg-slate-100' : stats.avgProfitPerKg > 1 ? 'bg-emerald-100 border-emerald-300' : stats.avgProfitPerKg > 0 ? 'bg-amber-100 border-amber-300' : 'bg-red-100 border-red-300';
                                return (
                                    <div key={pKey} className={`h-28 border-2 ${profitColor} rounded-xl flex flex-col items-center justify-center hover:shadow-lg transition-all group relative`}>
                                        <button onClick={(e) => { e.stopPropagation(); deletePlot(p.id); }} className="absolute top-1 right-1 p-1 hover:bg-red-50 rounded text-red-500 hover:text-red-700 opacity-0 group-hover:opacity-100 transition-opacity z-10" title="Delete plot">
                                            <Trash2 className="w-4 h-4" />
                                        </button>
                                        <div onClick={() => setSelectedPlot(p)} className="flex flex-col items-center justify-center cursor-pointer w-full h-full">
                                            <Warehouse className="w-6 h-6 text-emerald-600 mb-1"/>
                                            <span className="font-bold text-slate-700 text-sm">{p.name}</span>
                                            {stats && <span className={`text-xs font-bold mt-1 ${stats.avgProfitPerKg >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>${stats.avgProfitPerKg.toFixed(2)}/kg</span>}
                                            {stats && <span className="text-[10px] text-slate-500">{stats.cycleCount} cycles</span>}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>}
                        <h4 className="text-sm font-bold text-slate-500 uppercase mb-4">Open Fields ({fields.length})</h4>
                        {fields.length === 0 ? <div className="p-4 border border-dashed rounded text-center text-slate-400">No Fields</div> :
                        <div className="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-8 gap-3">
                            {fields.map(p => {
                                const displayId = p.plotId || p.plotDisplayId || p.id;
                                const pKey = `field-${displayId}`;
                                const stats = plotStats.find(x => x.plotKey === pKey);
                                const profitColor = !stats ? 'bg-slate-50' : stats.avgProfitPerKg > 1 ? 'bg-emerald-50 border-emerald-200' : stats.avgProfitPerKg > 0 ? 'bg-amber-50 border-amber-200' : 'bg-red-50 border-red-200';
                                return (
                                    <div key={pKey} className={`h-20 border-2 ${profitColor} rounded-xl flex flex-col items-center justify-center hover:shadow-md transition-all group relative`}>
                                        <button onClick={(e) => { e.stopPropagation(); deletePlot(p.id); }} className="absolute top-1 right-1 p-0.5 hover:bg-red-50 rounded text-red-500 hover:text-red-700 opacity-0 group-hover:opacity-100 transition-opacity z-10" title="Delete plot">
                                            <Trash2 className="w-3 h-3" />
                                        </button>
                                        <div onClick={() => setSelectedPlot(p)} className="flex flex-col items-center justify-center cursor-pointer w-full h-full">
                                            <Sprout className="w-4 h-4 text-amber-600 mb-1"/>
                                            <span className="font-bold text-slate-600 text-xs">{p.name}</span>
                                            {stats && <span className={`text-[9px] font-bold ${stats.avgProfitPerKg >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>${stats.avgProfitPerKg.toFixed(2)}</span>}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>}
                    </div>
                    
                    {/* Plot Comparison Chart */}
                    {plotStats.length > 0 && (
                        <div className="bg-white rounded-xl border p-6 shadow-sm">
                            <h4 className="font-bold text-slate-800 mb-4">📊 Plot Profit Comparison</h4>
                            <SVGBarChart data={plotStats.slice(0, 10).map(p => ({ label: p.plotName, value: p.avgProfitPerKg }))} color="emerald" unit="$/kg" />
                        </div>
                    )}
                </div>
            );
            
            // ==================== PLOT DETAIL MODAL ====================
            const getPlotCycleMetrics = (plot) => {
                const displayId = plot.plotId || plot.plotDisplayId || plot.id;
                const plotKey = `${plot.type === 'Greenhouse' ? 'greenhouse' : 'field'}-${displayId}`;
                return calculateCycleScores.filter(c => c.plotKey === plotKey);
            };
            
            return (
                <div className="space-y-6 animate-fade-in pb-20">
                    {/* Header */}
                    <div className="flex justify-between items-center flex-wrap gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-900">Statistical Analysis Center</h2>
                            <p className="text-slate-500 text-sm">Deep dive into performance metrics and discover key success factors</p>
                        </div>
                        <div className="flex items-center gap-3">
                            <label className="text-sm font-medium text-slate-700">Filter by Year:</label>
                            <select 
                                value={selectedYear} 
                                onChange={(e) => setSelectedYear(e.target.value)}
                                className="px-4 py-2 border border-slate-300 rounded-lg bg-white text-sm font-medium text-slate-700 hover:border-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
                            >
                                <option value="all">All Years</option>
                                {availableYears.map(year => (
                                    <option key={year} value={year}>{year}</option>
                                ))}
                            </select>
                        </div>
                    </div>
                    
                    {/* Tab Navigation */}
                    <div className="bg-white rounded-xl border p-1 shadow-sm flex gap-1 overflow-x-auto">
                        {[
                            { id: 'overview', label: '📊 Overview', desc: 'KPIs & Rankings' },
                            { id: 'cycles', label: '🔄 Cycles', desc: 'Compare Cycles' },
                            { id: 'factors', label: '🔬 Factors', desc: 'What Works?' },
                            { id: 'plots', label: '🗺️ Plots', desc: 'Plot Analysis' }
                        ].map(tab => (
                            <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                                className={`flex-1 min-w-[120px] px-4 py-3 rounded-lg font-medium transition-all text-sm ${activeTab === tab.id ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-50'}`}>
                                <span className="block">{tab.label}</span>
                                <span className={`text-[10px] ${activeTab === tab.id ? 'text-emerald-100' : 'text-slate-400'}`}>{tab.desc}</span>
                            </button>
                        ))}
                    </div>
                    
                    {/* Tab Content */}
                    {activeTab === 'overview' && renderOverview()}
                    {activeTab === 'cycles' && renderCycleComparison()}
                    {activeTab === 'factors' && renderFactorAnalysis()}
                    {activeTab === 'plots' && renderPlotAnalysis()}
                    
                    {/* Plot Detail Modal */}
                    {selectedPlot && (
                        <div className="fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-6xl h-[90vh] flex flex-col animate-fade-in-up">
                                <div className="flex justify-between items-center p-6 border-b bg-gradient-to-r from-slate-800 to-slate-900 rounded-t-xl text-white">
                                    <div>
                                        <h3 className="font-bold text-2xl">{selectedPlot.name} Deep Dive</h3>
                                        <p className="text-slate-300 text-sm">{selectedPlot.type} • {getPlotCycleMetrics(selectedPlot).length} completed cycles</p>
                                    </div>
                                    <button onClick={() => setSelectedPlot(null)} className="p-2 hover:bg-white/10 rounded-full"><X className="w-6 h-6"/></button>
                                </div>
                                
                                {/* Plot Summary Stats */}
                                {(() => {
                                    const cycles = getPlotCycleMetrics(selectedPlot);
                                    const displayId = selectedPlot.plotId || selectedPlot.plotDisplayId || selectedPlot.id;
                                    const plotKey = `${selectedPlot.type === 'Greenhouse' ? 'greenhouse' : 'field'}-${displayId}`;
                                    const stats = plotStats.find(p => p.plotKey === plotKey);
                                    if(!stats || cycles.length === 0) return <div className="flex-1 flex items-center justify-center text-slate-400">No completed cycles for this plot</div>;
                                    
                                    return (
                                        <div className="flex-1 overflow-auto p-6">
                                            {/* Summary Cards */}
                                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                                                <MiniCard title="Total Revenue" value={`$${stats.totalRevenue.toLocaleString()}`} subtitle={`${stats.cycleCount} cycles`} icon={DollarSign} color="emerald" />
                                                <MiniCard title="Total Profit" value={`$${stats.totalProfit.toLocaleString()}`} subtitle={`$${stats.avgProfitPerKg.toFixed(2)}/kg avg`} icon={BarChart3} color="blue" />
                                                <MiniCard title="Avg Survival" value={`${stats.avgSurvivalRate.toFixed(0)}%`} subtitle="Plant survival" icon={Sprout} color="purple" />
                                                <MiniCard title="Avg ROI" value={`${stats.avgROI.toFixed(0)}%`} subtitle="Return on investment" icon={PieChart} color="amber" />
                                            </div>
                                            
                                            {/* Trend Charts */}
                                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                                                <div className="bg-slate-50 rounded-xl p-4">
                                                    <h4 className="font-bold text-slate-700 text-sm mb-3">Profit/kg Trend</h4>
                                                    <SVGBarChart data={cycles.slice().reverse().map(c => ({ label: `Y${c.year}C${c.cycle}`, value: c.profitPerKg }))} color="emerald" unit="$" />
                                                </div>
                                                <div className="bg-slate-50 rounded-xl p-4">
                                                    <h4 className="font-bold text-slate-700 text-sm mb-3">Survival Rate Trend</h4>
                                                    <SVGBarChart data={cycles.slice().reverse().map(c => ({ label: `Y${c.year}C${c.cycle}`, value: c.survivalRate }))} color="blue" unit="%" />
                                                </div>
                                            </div>
                                            
                                            {/* Detailed Table */}
                                            <div className="bg-white border rounded-xl overflow-hidden">
                                                <table className="w-full text-xs text-left">
                                                    <thead className="bg-slate-100 sticky top-0">
                                                        <tr>
                                                            <th className="p-3 font-bold">Cycle</th>
                                                            <th className="p-3 font-bold text-center">Score</th>
                                                            <th className="p-3 font-bold">Variety</th>
                                                            <th className="p-3 font-bold text-right">Harvest</th>
                                                            <th className="p-3 font-bold text-right">Head Wt</th>
                                                            <th className="p-3 font-bold text-right text-emerald-600">Profit/kg</th>
                                                            <th className="p-3 font-bold text-right">Survival</th>
                                                            <th className="p-3 font-bold text-right">ROI</th>
                                                            <th className="p-3 font-bold text-right text-blue-600">Water</th>
                                                            <th className="p-3 font-bold text-right text-purple-600">Spray</th>
                                                            <th className="p-3 font-bold text-right">Duration</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y">
                                                        {cycles.map((c, idx) => (
                                                            <tr key={idx} className="hover:bg-slate-50">
                                                                <td className="p-3 font-bold">Y{c.year}-C{c.cycle}</td>
                                                                <td className="p-3 text-center"><ScoreBadge score={c.overallScore} size="sm" /></td>
                                                                <td className="p-3 text-slate-600">{c.varieties}</td>
                                                                <td className="p-3 text-right font-medium">{c.weight.toLocaleString()} kg</td>
                                                                <td className="p-3 text-right">{c.avgHeadWeight.toFixed(3)} kg</td>
                                                                <td className={`p-3 text-right font-bold ${c.profitPerKg >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>${c.profitPerKg.toFixed(2)}</td>
                                                                <td className="p-3 text-right">{c.survivalRate.toFixed(0)}%</td>
                                                                <td className={`p-3 text-right font-bold ${c.roi >= 0 ? 'text-blue-600' : 'text-red-600'}`}>{c.roi.toFixed(0)}%</td>
                                                                <td className="p-3 text-right text-blue-600">{c.totalWaterLiters.toFixed(0)}L</td>
                                                                <td className="p-3 text-right text-purple-600">{c.sprayCount}x</td>
                                                                <td className="p-3 text-right">{c.durationDays}d</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    );
                                })()}
                            </div>
                        </div>
                    )}
                    
                    {/* Factor Detail Modal */}
                    {showFactorDetail && (
                        <div className="fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4" onClick={() => setShowFactorDetail(null)}>
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-lg p-6 animate-fade-in-up" onClick={e => e.stopPropagation()}>
                                <h3 className="font-bold text-xl mb-2 flex items-center gap-2"><span className="text-2xl">{showFactorDetail.icon}</span>{showFactorDetail.name}</h3>
                                <p className="text-slate-600 mb-4">How this factor differs between top and bottom performers:</p>
                                <div className="grid grid-cols-2 gap-4 mb-6">
                                    <div className="bg-emerald-50 p-4 rounded-xl text-center"><p className="text-emerald-600 text-sm font-medium">Top Performers</p><p className="text-3xl font-bold text-emerald-700">{showFactorDetail.topAvg.toFixed(1)}{showFactorDetail.unit}</p></div>
                                    <div className="bg-red-50 p-4 rounded-xl text-center"><p className="text-red-600 text-sm font-medium">Bottom Performers</p><p className="text-3xl font-bold text-red-700">{showFactorDetail.botAvg.toFixed(1)}{showFactorDetail.unit}</p></div>
                                </div>
                                <div className={`p-4 rounded-xl text-center ${showFactorDetail.diff > 0 ? 'bg-emerald-100' : 'bg-blue-100'}`}>
                                    <p className="text-sm font-medium">Difference</p>
                                    <p className="text-2xl font-bold">{showFactorDetail.diff > 0 ? '+' : ''}{showFactorDetail.diffPercent.toFixed(0)}%</p>
                                    <p className="text-xs mt-1 text-slate-600">{showFactorDetail.diff > 0 ? 'Top performers use MORE' : 'Top performers use LESS'} of this input</p>
                                </div>
                                <button onClick={() => setShowFactorDetail(null)} className="w-full mt-6 py-3 bg-slate-800 text-white rounded-lg font-medium hover:bg-slate-700">Close</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // App Component
        const App = () => {
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [currentView, setCurrentView] = useState('dashboard');
            const [isSidebarOpen, setSidebarOpen] = useState(true);
            const [materials, setMaterials] = useState([]);
            const [nurseryRecords, setNurseryRecords] = useState([]);
            const [plantingData, setPlantingData] = useState({});
            const [plantingRecords, setPlantingRecords] = useState([]);
            const [harvestRecords, setHarvestRecords] = useState([]);
            const [sprayingRecords, setSprayingRecords] = useState([]);
            const [irrigationUnits, setIrrigationUnits] = useState([]);
            const [irrigationRecords, setIrrigationRecords] = useState([]);
            const [plotStates, setPlotStates] = useState({});
            const [plots, setPlots] = useState([]);
            const [dataLoading, setDataLoading] = useState(true);

            // Auth listener
            useEffect(() => { const unsub = window.Firebase.onAuthStateChanged((u) => { setUser(u); setAuthLoading(false); }); return () => unsub(); }, []);

            // Firestore listeners - only when user is logged in
            useEffect(() => {
                if (!user) { setDataLoading(false); return; }
                setDataLoading(true);
                const unsubs = [];
                
                // Materials collection
                unsubs.push(window.Firebase.onSnapshot('materials', (data) => {
                    setMaterials(data);
                }));
                
                // Nursery records
                unsubs.push(window.Firebase.onSnapshot('nurseryRecords', setNurseryRecords));
                
                // Planting records
                unsubs.push(window.Firebase.onSnapshot('plantingRecords', setPlantingRecords));
                
                // Harvest records
                unsubs.push(window.Firebase.onSnapshot('harvestRecords', setHarvestRecords));
                
                // Spraying records
                unsubs.push(window.Firebase.onSnapshot('sprayingRecords', setSprayingRecords));
                
                // Irrigation records
                unsubs.push(window.Firebase.onSnapshot('irrigationRecords', setIrrigationRecords));
                
                // Irrigation units
                unsubs.push(window.Firebase.onSnapshot('irrigationUnits', (data) => {
