<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenLeaf Farm Manager v3.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="js/gemini.js"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { animation: fadeInUp 0.3s ease-out forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="root"><div class="flex items-center justify-center h-screen"><div class="text-center"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-600 mx-auto mb-4"></div><p class="text-slate-600">Loading...</p></div></div></div>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        const firebaseConfig = { apiKey: "AIzaSyCrjDJXH5uAGLRVuGeEOJmprt06XgtKMc4", authDomain: "farm-management-66416.firebaseapp.com", projectId: "farm-management-66416", storageBucket: "farm-management-66416.firebasestorage.app", messagingSenderId: "217392479842", appId: "1:217392479842:web:86306ca7a50fef378b1b3b" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        window.Firebase = {
            signInWithEmailAndPassword: (email, password) => signInWithEmailAndPassword(auth, email, password),
            createUserWithEmailAndPassword: (email, password) => createUserWithEmailAndPassword(auth, email, password),
            signOut: () => signOut(auth),
            onAuthStateChanged: (cb) => onAuthStateChanged(auth, cb),
            addDoc: async (col, data) => await addDoc(collection(db, col), { ...data, createdAt: serverTimestamp() }),
            updateDoc: async (col, id, data) => await updateDoc(doc(db, col, id), { ...data, updatedAt: serverTimestamp() }),
            deleteDoc: async (col, id) => await deleteDoc(doc(db, col, id)),
            setDoc: async (col, id, data) => await setDoc(doc(db, col, id), { ...data, updatedAt: serverTimestamp() }, { merge: true }),
            onSnapshot: (col, cb) => onSnapshot(collection(db, col), (snap) => cb(snap.docs.map(d => ({ id: d.id, ...d.data() }))), (err) => { console.error(err); cb([]); })
        };
        window.firebaseReady = true;
        window.dispatchEvent(new Event('firebase-ready'));
    </script>
    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        // Icons
        const IconBase = ({ children, className, ...props }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>{children}</svg>);
        const Sprout = (p) => <IconBase {...p}><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/></IconBase>;
        const Tractor = (p) => <IconBase {...p}><path d="M3 4h9l1 7"/><path d="M4 11V4"/><path d="M8 10V4"/><path d="M18 5c-.6 0-1 .4-1 1v5.6"/><path d="m10 11 11 .9c.6 0 .9.5.8 1.1l-.8 5h-1"/><path d="M16 18h-5"/><path d="M3 11h10v7h-1"/><circle cx="7" cy="15" r="3"/><circle cx="17" cy="17" r="3"/></IconBase>;
        const Sun = (p) => <IconBase {...p}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></IconBase>;
        const Wind = (p) => <IconBase {...p}><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></IconBase>;
        const Warehouse = (p) => <IconBase {...p}><path d="M22 8.35V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8.35A2 2 0 0 1 3.26 6.5l8-3.2a2 2 0 0 1 1.48 0l8 3.2A2 2 0 0 1 22 8.35Z"/><path d="M6 18h12"/><path d="M6 14h12"/><rect width="12" height="12" x="6" y="10"/></IconBase>;
        const LayoutGrid = (p) => <IconBase {...p}><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></IconBase>;
        const Flower2 = (p) => <IconBase {...p}><path d="M12 5a3 3 0 1 1 3 3m-3-3a3 3 0 1 0-3 3m3-3v1M9 8a3 3 0 1 0 3 3M9 8h1m5 0a3 3 0 1 1-3 3m3-3h-1m-2 3v-1"/><circle cx="12" cy="8" r="2"/><path d="M12 10v12"/><path d="M12 22c4.2 0 7-1.667 7-5-4.2 0-7 1.667-7 5Z"/><path d="M12 22c-4.2 0-7-1.667-7-5 4.2 0 7 1.667 7 5Z"/></IconBase>;
        const Plus = (p) => <IconBase {...p}><path d="M5 12h14"/><path d="M12 5v14"/></IconBase>;
        const Edit2 = (p) => <IconBase {...p}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></IconBase>;
        const Trash2 = (p) => <IconBase {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></IconBase>;
        const BarChart3 = (p) => <IconBase {...p}><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></IconBase>;
        const Package = (p) => <IconBase {...p}><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></IconBase>;
        const Menu = (p) => <IconBase {...p}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></IconBase>;
        const DollarSign = (p) => <IconBase {...p}><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></IconBase>;
        const X = (p) => <IconBase {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconBase>;
        const Lock = (p) => <IconBase {...p}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></IconBase>;
        const AlertTriangle = (p) => <IconBase {...p}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></IconBase>;
        const Droplets = (p) => <IconBase {...p}><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.8-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"/></IconBase>;
        const Settings = (p) => <IconBase {...p}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></IconBase>;
        const PieChart = (p) => <IconBase {...p}><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></IconBase>;

        // Charts & Visualization Components
        const SVGBarChart = ({ data, color = 'blue', unit = '' }) => {
            if (!data || data.length === 0) return <div className="h-40 flex items-center justify-center text-slate-400 text-xs">No data</div>;
            const maxVal = Math.max(...data.map(d => d.value)) || 1;
            const colorMap = { blue: 'bg-blue-400', emerald: 'bg-emerald-400', amber: 'bg-amber-400', red: 'bg-red-400', purple: 'bg-purple-400', cyan: 'bg-cyan-400' };
            return (<div className="flex space-x-1 h-40 pt-4 pb-2 items-end">{data.map((d, i) => (<div key={i} className="flex-1 flex flex-col items-center justify-end h-full group"><div className="w-full relative flex-1 flex items-end justify-center"><div className={`w-full ${colorMap[color] || colorMap.blue} rounded-t relative hover:opacity-80 transition-all`} style={{ height: `${Math.max(3, (d.value / maxVal) * 100)}%` }}><div className="absolute -top-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-[10px] px-1.5 py-0.5 rounded opacity-0 group-hover:opacity-100 whitespace-nowrap z-10">{typeof d.value === 'number' ? d.value.toLocaleString() : d.value}{unit}</div></div></div><span className="text-[9px] text-slate-500 mt-1 truncate w-full text-center">{d.label}</span></div>))}</div>);
        };
        const SVGDonutChart = ({ data, size = 120, showLegend = false }) => {
            if (!data || data.length === 0) return <div className="h-32 flex items-center justify-center text-slate-400 text-xs">No data</div>;
            const total = data.reduce((acc, d) => acc + d.value, 0);
            let cumulative = 0;
            const colors = ['#10b981', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#f97316', '#ec4899'];
            return (<div className="flex items-center gap-4"><div className="relative flex justify-center"><svg width={size} height={size} viewBox="0 0 42 42">{data.map((d, i) => { const percent = (d.value / total) * 100; cumulative += d.value; return (<circle key={i} cx="21" cy="21" r="15.915" fill="transparent" stroke={colors[i % colors.length]} strokeWidth="5" strokeDasharray={`${percent} ${100 - percent}`} strokeDashoffset={25 - (cumulative - d.value) / total * 100} className="transition-all hover:opacity-70" />); })}</svg><div className="absolute inset-0 flex items-center justify-center flex-col"><span className="text-lg font-bold text-slate-700">{total.toLocaleString()}</span><span className="text-[9px] text-slate-400">Total</span></div></div>{showLegend && <div className="text-xs space-y-1">{data.slice(0,5).map((d, i) => (<div key={i} className="flex items-center gap-2"><div className="w-2.5 h-2.5 rounded-full" style={{background: colors[i % colors.length]}}></div><span className="text-slate-600 truncate max-w-[80px]">{d.label}</span><span className="font-bold text-slate-800">{d.value}</span></div>))}</div>}</div>);
        };
        const SVGLineChart = ({ data, color = '#10b981', height = 60 }) => {
            if (!data || data.length < 2) return <div className="h-16 flex items-center justify-center text-slate-400 text-xs">Insufficient data</div>;
            const maxVal = Math.max(...data.map(d => d.value)) || 1;
            const minVal = Math.min(...data.map(d => d.value));
            const range = maxVal - minVal || 1;
            const points = data.map((d, i) => `${(i / (data.length - 1)) * 100},${100 - ((d.value - minVal) / range) * 80 - 10}`).join(' ');
            const areaPoints = `0,100 ${points} 100,100`;
            return (<svg viewBox="0 0 100 100" className="w-full" style={{height}}><defs><linearGradient id={`grad-${color.replace('#','')}`} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity="0.3"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs><polygon points={areaPoints} fill={`url(#grad-${color.replace('#','')})`}/><polyline points={points} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>{data.map((d, i) => (<circle key={i} cx={(i / (data.length - 1)) * 100} cy={100 - ((d.value - minVal) / range) * 80 - 10} r="2" fill={color}/>))}</svg>);
        };
        const Sparkline = ({ data, color = '#10b981', width = 80, height = 24 }) => {
            if (!data || data.length < 2) return <span className="text-slate-400">--</span>;
            const max = Math.max(...data); const min = Math.min(...data); const range = max - min || 1;
            const points = data.map((v, i) => `${(i / (data.length - 1)) * width},${height - ((v - min) / range) * (height - 4) - 2}`).join(' ');
            return (<svg width={width} height={height}><polyline points={points} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round"/></svg>);
        };
        const ProgressBar = ({ value, max, color = 'emerald', label, showPercent = true }) => {
            const percent = max > 0 ? Math.min(100, (value / max) * 100) : 0;
            const colorMap = { emerald: 'bg-emerald-500', blue: 'bg-blue-500', amber: 'bg-amber-500', red: 'bg-red-500', purple: 'bg-purple-500' };
            return (<div className="w-full"><div className="flex justify-between text-xs mb-1"><span className="text-slate-600">{label}</span>{showPercent && <span className="font-bold text-slate-700">{percent.toFixed(0)}%</span>}</div><div className="h-2 bg-slate-100 rounded-full overflow-hidden"><div className={`h-full ${colorMap[color]} rounded-full transition-all duration-500`} style={{width: `${percent}%`}}></div></div></div>);
        };
        const StatCard = ({ title, value, subtitle, icon: Icon, trend, trendValue, color = 'emerald', sparkData }) => {
            const colorMap = { emerald: 'from-emerald-500 to-emerald-600', blue: 'from-blue-500 to-blue-600', amber: 'from-amber-500 to-amber-600', red: 'from-red-500 to-red-600', purple: 'from-purple-500 to-purple-600', cyan: 'from-cyan-500 to-cyan-600', slate: 'from-slate-600 to-slate-700' };
            const iconBg = { emerald: 'bg-emerald-400/30', blue: 'bg-blue-400/30', amber: 'bg-amber-400/30', red: 'bg-red-400/30', purple: 'bg-purple-400/30', cyan: 'bg-cyan-400/30', slate: 'bg-slate-400/30' };
            return (<div className={`bg-gradient-to-br ${colorMap[color]} rounded-xl p-5 text-white shadow-lg relative overflow-hidden`}><div className="absolute top-0 right-0 w-24 h-24 bg-white/10 rounded-full -translate-y-8 translate-x-8"></div><div className="flex justify-between items-start relative z-10"><div className="flex-1"><p className="text-white/80 text-xs font-medium uppercase tracking-wide">{title}</p><h3 className="text-2xl font-bold mt-1">{value}</h3>{subtitle && <p className="text-white/70 text-xs mt-1">{subtitle}</p>}{trend !== undefined && <div className={`flex items-center gap-1 mt-2 text-xs ${trend >= 0 ? 'text-green-200' : 'text-red-200'}`}><span>{trend >= 0 ? '↑' : '↓'}</span><span>{Math.abs(trend).toFixed(1)}% {trendValue || ''}</span></div>}</div><div className={`${iconBg[color]} p-3 rounded-xl`}>{Icon && <Icon className="w-6 h-6" />}</div></div>{sparkData && <div className="mt-3 opacity-80"><Sparkline data={sparkData} color="#fff" /></div>}</div>);
        };
        const MiniCard = ({ title, value, subtitle, icon: Icon, color = 'slate' }) => {
            const borderColors = { emerald: 'border-l-emerald-500', blue: 'border-l-blue-500', amber: 'border-l-amber-500', red: 'border-l-red-500', purple: 'border-l-purple-500', cyan: 'border-l-cyan-500', slate: 'border-l-slate-400' };
            const iconColors = { emerald: 'text-emerald-500 bg-emerald-50', blue: 'text-blue-500 bg-blue-50', amber: 'text-amber-500 bg-amber-50', red: 'text-red-500 bg-red-50', purple: 'text-purple-500 bg-purple-50', cyan: 'text-cyan-500 bg-cyan-50', slate: 'text-slate-500 bg-slate-50' };
            return (<div className={`bg-white rounded-lg p-4 border border-slate-200 border-l-4 ${borderColors[color]} shadow-sm hover:shadow-md transition-shadow`}><div className="flex items-center justify-between"><div><p className="text-xs text-slate-500 uppercase tracking-wide">{title}</p><p className="text-xl font-bold text-slate-800 mt-1">{value}</p>{subtitle && <p className="text-xs text-slate-400 mt-0.5">{subtitle}</p>}</div>{Icon && <div className={`p-2 rounded-lg ${iconColors[color]}`}><Icon className="w-5 h-5" /></div>}</div></div>);
        };
        const AlertCard = ({ type = 'warning', title, message, action }) => {
            const styles = { warning: 'bg-amber-50 border-amber-200 text-amber-800', danger: 'bg-red-50 border-red-200 text-red-800', success: 'bg-emerald-50 border-emerald-200 text-emerald-800', info: 'bg-blue-50 border-blue-200 text-blue-800' };
            const icons = { warning: '⚠️', danger: '🚨', success: '✅', info: 'ℹ️' };
            return (<div className={`${styles[type]} border rounded-lg p-3 flex items-start gap-3`}><span className="text-lg">{icons[type]}</span><div className="flex-1"><p className="font-bold text-sm">{title}</p><p className="text-xs mt-0.5 opacity-80">{message}</p></div>{action && <button className="text-xs font-bold underline hover:no-underline">{action}</button>}</div>);
        };
        const HeatMapCell = ({ value, max, label, onClick }) => {
            const intensity = max > 0 ? Math.min(1, value / max) : 0;
            const bg = intensity > 0.7 ? 'bg-emerald-500' : intensity > 0.4 ? 'bg-emerald-300' : intensity > 0.1 ? 'bg-emerald-100' : 'bg-slate-50';
            const text = intensity > 0.5 ? 'text-white' : 'text-slate-600';
            return (<button onClick={onClick} className={`${bg} ${text} p-2 rounded text-xs font-bold hover:opacity-80 transition-all aspect-square flex items-center justify-center`} title={`${label}: ${value}`}>{label}</button>);
        };

        // Login Screen
        const LoginScreen = () => {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);
            const handleSubmit = async (e) => {
                e.preventDefault(); setError(''); setLoading(true);
                try { if (isLogin) await window.Firebase.signInWithEmailAndPassword(email, password); else await window.Firebase.createUserWithEmailAndPassword(email, password); }
                catch (err) { setError(err.message || 'Auth failed'); }
                finally { setLoading(false); }
            };
            return (<div className="min-h-screen bg-gradient-to-br from-emerald-500 via-emerald-600 to-teal-700 flex items-center justify-center p-4"><div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden animate-fade-in-up"><div className="bg-slate-900 p-8 text-center"><div className="flex items-center justify-center space-x-3 mb-2"><div className="bg-emerald-500 p-3 rounded-xl"><Sprout className="w-8 h-8 text-white" /></div></div><h1 className="text-2xl font-bold text-white">GreenLeaf</h1><p className="text-emerald-300 text-sm mt-1">Farm Management System</p></div><div className="p-8"><h2 className="text-xl font-bold text-slate-800 mb-6 text-center">{isLogin ? 'Welcome Back' : 'Create Account'}</h2>{error && <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4 text-sm">{error}</div>}<form onSubmit={handleSubmit} className="space-y-4"><div><label className="block text-sm font-medium text-slate-700 mb-1">Email</label><input type="email" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500" placeholder="you@example.com" required disabled={loading} /></div><div><label className="block text-sm font-medium text-slate-700 mb-1">Password</label><input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500" placeholder="••••••••" required disabled={loading} minLength={6} /></div><button type="submit" disabled={loading} className="w-full bg-emerald-600 text-white py-3 px-4 rounded-lg font-medium hover:bg-emerald-700 disabled:opacity-50 flex items-center justify-center gap-2">{loading ? <><div className="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div><span>Please wait...</span></> : <><Lock className="w-5 h-5" /><span>{isLogin ? 'Sign In' : 'Create Account'}</span></>}</button></form><div className="mt-6 text-center"><button onClick={() => { setIsLogin(!isLogin); setError(''); }} className="text-emerald-600 hover:text-emerald-700 text-sm font-medium" disabled={loading}>{isLogin ? "Don't have an account? Sign up" : 'Already have an account? Sign in'}</button></div></div></div></div>);
        };

        // Dashboard - The Command Center
        const Dashboard = ({ materials, nurseryRecords, plantingRecords, harvestRecords, sprayingRecords, irrigationRecords, plotStates, plantingData }) => {
            const [selectedYear, setSelectedYear] = useState('all');
            const [aiInsights, setAiInsights] = useState(null);
            
            // Get available years
            const availableYears = useMemo(() => {
                const years = new Set();
                plantingRecords.forEach(r => r.year && years.add(r.year));
                harvestRecords.forEach(r => r.year && years.add(r.year));
                return Array.from(years).sort((a, b) => b - a);
            }, [plantingRecords, harvestRecords]);
            
            // Load saved AI insights
            useEffect(() => {
                const unsub = window.Firebase.onSnapshot('aiInsights', (data) => {
                    const sorted = data.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
                    if (sorted.length > 0) {
                        setAiInsights(sorted[0]);
                    }
                });
                return () => unsub && unsub();
            }, []);
            
            // Filter records by year
            const filteredHarvestRecords = useMemo(() => {
                if (selectedYear === 'all') return harvestRecords;
                return harvestRecords.filter(r => r.year === parseInt(selectedYear));
            }, [harvestRecords, selectedYear]);
            
            const filteredPlantingRecords = useMemo(() => {
                if (selectedYear === 'all') return plantingRecords;
                return plantingRecords.filter(r => r.year === parseInt(selectedYear));
            }, [plantingRecords, selectedYear]);
            // Calculate Financial KPIs (using filtered data)
            const totalRevenue = useMemo(() => filteredHarvestRecords.reduce((sum, r) => sum + (r.revenue || 0), 0), [filteredHarvestRecords]);
            const totalMaterialCost = useMemo(() => materials.reduce((sum, m) => sum + (m.total || 0), 0), [materials]);
            const totalPackagingCost = useMemo(() => filteredHarvestRecords.reduce((sum, r) => sum + (r.packagingCost || 0), 0), [filteredHarvestRecords]);
            const grossProfit = totalRevenue - totalPackagingCost;
            const profitMargin = totalRevenue > 0 ? ((grossProfit / totalRevenue) * 100) : 0;
            
            // Production Pipeline Stats
            const activeNurseryBatches = nurseryRecords.filter(r => r.remainingCount > 0).length;
            const totalSeedlings = nurseryRecords.reduce((sum, r) => sum + (r.remainingCount || 0), 0);
            const activePlots = Object.keys(plotStates).filter(k => ['growing', 'fully_planted'].includes(plotStates[k]?.status)).length;
            const readyToHarvest = Object.keys(plotStates).filter(k => plotStates[k]?.status === 'fully_planted').length;
            const totalHarvested = filteredHarvestRecords.reduce((sum, r) => sum + (r.totalHeads || 0), 0);
            const totalWeight = filteredHarvestRecords.reduce((sum, r) => sum + (r.weight || 0), 0);
            
            // Resource Usage
            const totalWaterUsed = useMemo(() => {
                const sprayWater = sprayingRecords.reduce((sum, r) => sum + Number(r.water || 0), 0);
                const irrWater = irrigationRecords.reduce((sum, r) => sum + Number(r.water || 0), 0);
                return sprayWater + irrWater;
            }, [sprayingRecords, irrigationRecords]);
            
            // Alerts
            const alerts = useMemo(() => {
                const list = [];
                const lowStockMaterials = materials.filter(m => m.quantity > 0 && m.quantity < 50);
                if (lowStockMaterials.length > 0) list.push({ type: 'warning', title: 'Low Stock Alert', message: `${lowStockMaterials.length} material(s) running low` });
                if (readyToHarvest > 0) list.push({ type: 'success', title: 'Ready to Harvest', message: `${readyToHarvest} plot(s) ready for harvesting` });
                const recentSprays = sprayingRecords.filter(r => { const days = Math.ceil((new Date() - new Date(r.date)) / (1000*60*60*24)); return days > 14; });
                const plotsNeedingSpraying = new Set();
                Object.keys(plotStates).forEach(k => { if (['growing', 'fully_planted'].includes(plotStates[k]?.status)) { const hasRecentSpray = sprayingRecords.some(r => r.locations?.includes(k) && Math.ceil((new Date() - new Date(r.date)) / (1000*60*60*24)) <= 14); if (!hasRecentSpray) plotsNeedingSpraying.add(k); }});
                if (plotsNeedingSpraying.size > 0) list.push({ type: 'info', title: 'Spraying Reminder', message: `${plotsNeedingSpraying.size} plot(s) haven't been sprayed in 2 weeks` });
                return list;
            }, [materials, readyToHarvest, sprayingRecords, plotStates]);
            
            // Revenue Trend (last 7 entries) - using filtered data
            const revenueTrend = useMemo(() => {
                const byDate = {};
                filteredHarvestRecords.forEach(r => { byDate[r.date] = (byDate[r.date] || 0) + (r.revenue || 0); });
                return Object.keys(byDate).sort().slice(-7).map(d => ({ label: d.split('-').slice(1).join('/'), value: byDate[d] }));
            }, [filteredHarvestRecords]);
            
            // Harvest by Variety - using filtered data
            const harvestByVariety = useMemo(() => {
                const byVariety = {};
                filteredHarvestRecords.forEach(r => { byVariety[r.variety] = (byVariety[r.variety] || 0) + (r.totalHeads || 0); });
                return Object.entries(byVariety).map(([label, value]) => ({ label, value })).sort((a,b) => b.value - a.value).slice(0, 5);
            }, [filteredHarvestRecords]);
            
            // Material Usage by Category
            const materialByCategory = useMemo(() => {
                const byCategory = {};
                materials.forEach(m => { byCategory[m.category] = (byCategory[m.category] || 0) + (m.total || 0); });
                return Object.entries(byCategory).map(([label, value]) => ({ label, value })).sort((a,b) => b.value - a.value);
            }, [materials]);
            
            // Plot Performance (Top 5) - using filtered data
            const plotPerformance = useMemo(() => {
                const byPlot = {};
                filteredHarvestRecords.forEach(r => { if (!byPlot[r.plotKey]) byPlot[r.plotKey] = { revenue: 0, weight: 0, heads: 0 }; byPlot[r.plotKey].revenue += r.revenue || 0; byPlot[r.plotKey].weight += r.weight || 0; byPlot[r.plotKey].heads += r.totalHeads || 0; });
                return Object.entries(byPlot).map(([plot, data]) => ({ plot: plot.replace('-', ' ').replace('greenhouse', 'GH').replace('field', 'F'), ...data })).sort((a, b) => b.revenue - a.revenue).slice(0, 5);
            }, [filteredHarvestRecords]);
            
            // Recent Activity - using filtered data
            const recentActivity = useMemo(() => {
                const activities = [];
                filteredPlantingRecords.slice(0, 3).forEach(r => activities.push({ type: 'planting', date: r.date, text: `Planted ${r.quantity} ${r.variety} in ${r.location}` }));
                filteredHarvestRecords.slice(0, 3).forEach(r => activities.push({ type: 'harvest', date: r.date, text: `Harvested ${r.totalHeads} heads from ${r.location}` }));
                sprayingRecords.slice(0, 2).forEach(r => activities.push({ type: 'spray', date: r.date, text: `Sprayed ${r.locations?.length || 0} plots with ${r.water}L water` }));
                return activities.sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 6);
            }, [filteredPlantingRecords, filteredHarvestRecords, sprayingRecords]);
            
            return (<div className="space-y-6 animate-fade-in pb-20">
                {/* Header */}
                <div className="flex justify-between items-center flex-wrap gap-4">
                    <div>
                        <h2 className="text-2xl font-bold text-slate-900">Farm Command Center</h2>
                        <p className="text-slate-500 text-sm">Real-time overview of your farm operations</p>
                    </div>
                    <div className="flex items-center gap-4">
                        <div className="flex items-center gap-3">
                            <label className="text-sm font-medium text-slate-700">Filter by Year:</label>
                            <select 
                                value={selectedYear} 
                                onChange={(e) => setSelectedYear(e.target.value)}
                                className="px-4 py-2 border border-slate-300 rounded-lg bg-white text-sm font-medium text-slate-700 hover:border-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
                            >
                                <option value="all">All Years</option>
                                {availableYears.map(year => (
                                    <option key={year} value={year}>{year}</option>
                                ))}
                            </select>
                        </div>
                        <div className="text-right text-xs text-slate-400">
                            <p>{new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
                        </div>
                    </div>
                </div>
                
                {/* AI Insights Section */}
                {aiInsights && (
                    <div className="bg-gradient-to-r from-purple-50 to-pink-50 rounded-xl border-2 border-purple-200 shadow-sm overflow-hidden">
                        <div className="bg-gradient-to-r from-purple-600 to-pink-600 px-6 py-4">
                            <div className="flex justify-between items-center">
                                <h3 className="font-bold text-lg text-white flex items-center gap-2">🤖 AI-Powered Insights</h3>
                                <span className="text-xs text-white/80">{aiInsights.createdAt ? new Date(aiInsights.createdAt).toLocaleDateString() : 'Recent'}</span>
                            </div>
                        </div>
                        <div className="p-6">
                            <div className="prose prose-sm max-w-none">
                                <div className="text-slate-700 leading-relaxed line-clamp-3" dangerouslySetInnerHTML={{__html: aiInsights.analysis.substring(0, 300).replace(/\n/g, '<br/>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') + '...'}} />
                            </div>
                            <button 
                                onClick={() => window.location.hash = '#statistical'}
                                className="mt-4 text-purple-600 hover:text-purple-700 text-sm font-medium flex items-center gap-1"
                            >
                                View Full Analysis →
                            </button>
                        </div>
                    </div>
                )}
                
                {/* Alerts */}
                {alerts.length > 0 && <div className="space-y-2">{alerts.map((a, i) => <AlertCard key={i} {...a} />)}</div>}
                
                {/* Top KPIs */}
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    <StatCard title="Total Revenue" value={`$${totalRevenue.toLocaleString()}`} icon={DollarSign} color="emerald" subtitle="All harvests" sparkData={revenueTrend.map(r => r.value)} />
                    <StatCard title="Gross Profit" value={`$${grossProfit.toLocaleString()}`} icon={BarChart3} color={grossProfit >= 0 ? 'blue' : 'red'} subtitle={`${profitMargin.toFixed(1)}% margin`} trend={profitMargin > 20 ? 5 : -3} />
                    <StatCard title="Total Harvested" value={`${totalWeight.toLocaleString()} kg`} icon={Tractor} color="amber" subtitle={`${totalHarvested.toLocaleString()} heads`} />
                    <StatCard title="Water Used" value={`${totalWaterUsed.toLocaleString()} L`} icon={Droplets} color="cyan" subtitle="Irrigation + Spraying" />
                </div>
                
                {/* Production Pipeline */}
                <div className="bg-white rounded-xl border p-6 shadow-sm">
                    <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2"><Sprout className="w-5 h-5 text-emerald-600" /> Production Pipeline</h3>
                    <div className="grid grid-cols-4 gap-4 relative">
                        <div className="text-center p-4 bg-purple-50 rounded-xl border border-purple-100"><Flower2 className="w-8 h-8 text-purple-500 mx-auto mb-2" /><p className="text-2xl font-bold text-slate-800">{totalSeedlings.toLocaleString()}</p><p className="text-xs text-slate-500">Seedlings Ready</p><p className="text-[10px] text-purple-600 font-medium mt-1">{activeNurseryBatches} batches</p></div>
                        <div className="text-center p-4 bg-emerald-50 rounded-xl border border-emerald-100"><Sprout className="w-8 h-8 text-emerald-500 mx-auto mb-2" /><p className="text-2xl font-bold text-slate-800">{activePlots}</p><p className="text-xs text-slate-500">Growing Plots</p><p className="text-[10px] text-emerald-600 font-medium mt-1">{readyToHarvest} ready</p></div>
                        <div className="text-center p-4 bg-amber-50 rounded-xl border border-amber-100"><Tractor className="w-8 h-8 text-amber-500 mx-auto mb-2" /><p className="text-2xl font-bold text-slate-800">{filteredHarvestRecords.length}</p><p className="text-xs text-slate-500">Harvest Events</p><p className="text-[10px] text-amber-600 font-medium mt-1">{totalWeight.toLocaleString()} kg total</p></div>
                        <div className="text-center p-4 bg-blue-50 rounded-xl border border-blue-100"><DollarSign className="w-8 h-8 text-blue-500 mx-auto mb-2" /><p className="text-2xl font-bold text-slate-800">${(totalRevenue/1000).toFixed(1)}k</p><p className="text-xs text-slate-500">Revenue</p><p className="text-[10px] text-blue-600 font-medium mt-1">${totalWeight > 0 ? (totalRevenue/totalWeight).toFixed(2) : 0}/kg avg</p></div>
                        <div className="absolute top-1/2 left-[25%] w-[16%] h-0.5 bg-slate-200 -translate-y-1/2"><div className="absolute right-0 top-1/2 -translate-y-1/2 w-2 h-2 bg-slate-300 rotate-45"></div></div>
                        <div className="absolute top-1/2 left-[50%] w-[16%] h-0.5 bg-slate-200 -translate-y-1/2"><div className="absolute right-0 top-1/2 -translate-y-1/2 w-2 h-2 bg-slate-300 rotate-45"></div></div>
                        <div className="absolute top-1/2 left-[75%] w-[16%] h-0.5 bg-slate-200 -translate-y-1/2"><div className="absolute right-0 top-1/2 -translate-y-1/2 w-2 h-2 bg-slate-300 rotate-45"></div></div>
                    </div>
                </div>
                
                {/* Charts Row */}
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    {/* Revenue Trend */}
                    <div className="bg-white rounded-xl border p-5 shadow-sm"><h4 className="font-bold text-slate-700 text-sm mb-4 flex items-center gap-2"><BarChart3 className="w-4 h-4 text-emerald-500" /> Revenue Trend</h4><SVGBarChart data={revenueTrend} color="emerald" unit="$" /></div>
                    {/* Harvest by Variety */}
                    <div className="bg-white rounded-xl border p-5 shadow-sm"><h4 className="font-bold text-slate-700 text-sm mb-4 flex items-center gap-2"><PieChart className="w-4 h-4 text-blue-500" /> Harvest by Variety</h4><SVGDonutChart data={harvestByVariety} showLegend /></div>
                    {/* Material Costs */}
                    <div className="bg-white rounded-xl border p-5 shadow-sm"><h4 className="font-bold text-slate-700 text-sm mb-4 flex items-center gap-2"><Package className="w-4 h-4 text-amber-500" /> Material Investment</h4><SVGDonutChart data={materialByCategory} showLegend /></div>
                </div>
                
                {/* Bottom Row */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    {/* Top Performing Plots */}
                    <div className="bg-white rounded-xl border p-5 shadow-sm"><h4 className="font-bold text-slate-700 text-sm mb-4 flex items-center gap-2"><Warehouse className="w-4 h-4 text-purple-500" /> Top Performing Plots</h4>{plotPerformance.length === 0 ? <p className="text-slate-400 text-sm text-center py-8">No harvest data yet</p> : <div className="space-y-3">{plotPerformance.map((p, i) => (<div key={i} className="flex items-center gap-3"><span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${i === 0 ? 'bg-amber-100 text-amber-700' : i === 1 ? 'bg-slate-100 text-slate-600' : 'bg-orange-50 text-orange-600'}`}>{i + 1}</span><div className="flex-1"><div className="flex justify-between text-sm"><span className="font-medium text-slate-700 capitalize">{p.plot}</span><span className="font-bold text-emerald-600">${p.revenue.toLocaleString()}</span></div><ProgressBar value={p.revenue} max={plotPerformance[0]?.revenue || 1} color="emerald" showPercent={false} /></div></div>))}</div>}</div>
                    
                    {/* Recent Activity */}
                    <div className="bg-white rounded-xl border p-5 shadow-sm"><h4 className="font-bold text-slate-700 text-sm mb-4 flex items-center gap-2"><Settings className="w-4 h-4 text-cyan-500" /> Recent Activity</h4>{recentActivity.length === 0 ? <p className="text-slate-400 text-sm text-center py-8">No recent activity</p> : <div className="space-y-3">{recentActivity.map((a, i) => (<div key={i} className="flex items-start gap-3 text-sm"><div className={`w-2 h-2 rounded-full mt-1.5 ${a.type === 'harvest' ? 'bg-amber-500' : a.type === 'planting' ? 'bg-emerald-500' : 'bg-blue-500'}`}></div><div className="flex-1"><p className="text-slate-700">{a.text}</p><p className="text-xs text-slate-400">{a.date}</p></div></div>))}</div>}</div>
                </div>
                
                {/* Quick Stats */}
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <MiniCard title="Greenhouses" value={Object.keys(plotStates).filter(k => k.startsWith('greenhouse') && ['growing','fully_planted'].includes(plotStates[k]?.status)).length} subtitle="Active" icon={Warehouse} color="blue" />
                    <MiniCard title="Open Fields" value={Object.keys(plotStates).filter(k => k.startsWith('field') && ['growing','fully_planted'].includes(plotStates[k]?.status)).length} subtitle="Active" icon={LayoutGrid} color="amber" />
                    <MiniCard title="Materials" value={materials.length} subtitle={`$${totalMaterialCost.toLocaleString()} invested`} icon={Package} color="purple" />
                    <MiniCard title="Spray Events" value={sprayingRecords.length} subtitle={`${irrigationRecords.length} irrigations`} icon={Droplets} color="cyan" />
                </div>
            </div>);
        };

        // Materials Manager
        const MaterialsManager = ({ materials, setMaterials }) => {
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [viewMode, setViewMode] = useState('table');
            const [filterCategory, setFilterCategory] = useState('All');
            const [formData, setFormData] = useState({ name: '', category: 'Seeds', date: new Date().toISOString().split('T')[0], quantity: '', unitPrice: '' });
            const categories = ['Seeds', 'Fertilizers', 'Pesticides', 'Packaging Material', 'Water', 'Other'];
            
            // Analytics
            const totalValue = useMemo(() => materials.reduce((sum, m) => sum + (m.total || 0), 0), [materials]);
            const byCategory = useMemo(() => {
                const grouped = {};
                categories.forEach(c => grouped[c] = { count: 0, value: 0, qty: 0 });
                materials.forEach(m => { if (grouped[m.category]) { grouped[m.category].count++; grouped[m.category].value += m.total || 0; grouped[m.category].qty += m.quantity || 0; }});
                return grouped;
            }, [materials]);
            const lowStock = useMemo(() => materials.filter(m => m.quantity > 0 && m.quantity < 100), [materials]);
            const categoryChartData = useMemo(() => Object.entries(byCategory).filter(([,v]) => v.value > 0).map(([label, v]) => ({ label, value: v.value })), [byCategory]);
            const filteredMaterials = useMemo(() => filterCategory === 'All' ? materials : materials.filter(m => m.category === filterCategory), [materials, filterCategory]);
            
            const handleSubmit = async (e) => { e.preventDefault(); const item = { name: formData.name, category: formData.category, date: formData.date, quantity: Number(formData.quantity), unitPrice: Number(formData.unitPrice), total: Number(formData.quantity) * Number(formData.unitPrice) }; try { if (editingId) { await window.Firebase.updateDoc('materials', editingId, item); } else { await window.Firebase.addDoc('materials', item); } closeModal(); } catch (err) { console.error('Error saving material:', err); alert('Error saving: ' + err.message); } };
            const handleDelete = async (id) => { if(window.confirm('Delete?')) { try { await window.Firebase.deleteDoc('materials', id); } catch (err) { console.error('Error deleting:', err); alert('Error deleting: ' + err.message); } } };
            const closeModal = () => { setIsModalOpen(false); setEditingId(null); setFormData({ name: '', category: 'Seeds', date: new Date().toISOString().split('T')[0], quantity: '', unitPrice: '' }); };
            const getCategoryColor = (cat) => { const colors = { Seeds: 'emerald', Fertilizers: 'blue', Pesticides: 'red', 'Packaging Material': 'amber', Water: 'cyan', Other: 'slate' }; return colors[cat] || 'slate'; };
            
            return (<div className="space-y-6 animate-fade-in pb-20">
                <div className="flex justify-between items-center"><h2 className="text-2xl font-bold">Materials Inventory</h2><div className="flex gap-2"><button onClick={() => setViewMode(viewMode === 'table' ? 'analytics' : 'table')} className="bg-white border px-4 py-2 rounded-lg text-sm hover:bg-slate-50">{viewMode === 'table' ? '📊 Analytics' : '📋 Table'}</button><button onClick={() => setIsModalOpen(true)} className="bg-emerald-600 text-white px-4 py-2 rounded-lg flex gap-2"><Plus className="w-4 h-4" /> Add</button></div></div>
                
                {/* Summary Cards */}
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <MiniCard title="Total Items" value={materials.length} subtitle="In inventory" icon={Package} color="purple" />
                    <MiniCard title="Total Value" value={`$${totalValue.toLocaleString()}`} subtitle="Investment" icon={DollarSign} color="emerald" />
                    <MiniCard title="Categories" value={Object.values(byCategory).filter(v => v.count > 0).length} subtitle="Active types" icon={LayoutGrid} color="blue" />
                    <MiniCard title="Low Stock" value={lowStock.length} subtitle={lowStock.length > 0 ? 'Need restock' : 'All good'} icon={AlertTriangle} color={lowStock.length > 0 ? 'red' : 'emerald'} />
                </div>
                
                {viewMode === 'analytics' ? (
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {/* Investment by Category */}
                        <div className="bg-white rounded-xl border p-5 shadow-sm"><h4 className="font-bold text-slate-700 text-sm mb-4">Investment by Category</h4><SVGDonutChart data={categoryChartData} showLegend size={140} /></div>
                        
                        {/* Category Breakdown */}
                        <div className="bg-white rounded-xl border p-5 shadow-sm"><h4 className="font-bold text-slate-700 text-sm mb-4">Category Breakdown</h4><div className="space-y-3">{categories.filter(c => byCategory[c]?.count > 0).map(c => (<div key={c}><div className="flex justify-between text-sm mb-1"><span className="text-slate-600">{c}</span><span className="font-bold">${byCategory[c].value.toLocaleString()}</span></div><ProgressBar value={byCategory[c].value} max={totalValue} color={getCategoryColor(c)} showPercent={false} /><p className="text-xs text-slate-400 mt-1">{byCategory[c].count} items · {byCategory[c].qty.toLocaleString()} units</p></div>))}</div></div>
                        
                        {/* Low Stock Alerts */}
                        <div className="bg-white rounded-xl border p-5 shadow-sm lg:col-span-2"><h4 className="font-bold text-slate-700 text-sm mb-4 flex items-center gap-2"><AlertTriangle className="w-4 h-4 text-amber-500" /> Low Stock Items</h4>{lowStock.length === 0 ? <p className="text-slate-400 text-center py-4">All items have sufficient stock</p> : <div className="grid grid-cols-2 md:grid-cols-4 gap-3">{lowStock.map(m => (<div key={m.id} className="p-3 bg-red-50 border border-red-100 rounded-lg"><p className="font-bold text-sm text-slate-800 truncate">{m.name}</p><p className="text-xs text-slate-500">{m.category}</p><p className="text-lg font-bold text-red-600 mt-1">{m.quantity}</p><p className="text-xs text-red-500">units left</p></div>))}</div>}</div>
                    </div>
                ) : (
                    <>
                        {/* Filter */}
                        <div className="flex gap-2 flex-wrap"><button onClick={() => setFilterCategory('All')} className={`px-3 py-1.5 rounded-lg text-sm font-medium ${filterCategory === 'All' ? 'bg-slate-800 text-white' : 'bg-white border hover:bg-slate-50'}`}>All</button>{categories.map(c => byCategory[c]?.count > 0 && <button key={c} onClick={() => setFilterCategory(c)} className={`px-3 py-1.5 rounded-lg text-sm font-medium ${filterCategory === c ? 'bg-slate-800 text-white' : 'bg-white border hover:bg-slate-50'}`}>{c} ({byCategory[c].count})</button>)}</div>
                        
                        {/* Table */}
                        <div className="bg-white rounded-xl border overflow-hidden"><table className="w-full text-sm text-left"><thead className="bg-slate-50 border-b"><tr><th className="p-4">Date</th><th className="p-4">Category</th><th className="p-4">Name</th><th className="p-4 text-right">Qty</th><th className="p-4 text-right">Unit Price</th><th className="p-4 text-right">Total</th><th className="p-4 text-center">Actions</th></tr></thead><tbody>{filteredMaterials.map(i => <tr key={i.id} className={`border-b hover:bg-slate-50 ${i.quantity < 100 && i.quantity > 0 ? 'bg-red-50' : ''}`}><td className="p-4 text-slate-500">{i.date}</td><td className="p-4"><span className={`px-2 py-1 rounded text-xs font-bold bg-${getCategoryColor(i.category)}-100 text-${getCategoryColor(i.category)}-700`}>{i.category}</span></td><td className="p-4 font-bold">{i.name}</td><td className={`p-4 text-right font-medium ${i.quantity < 100 && i.quantity > 0 ? 'text-red-600' : ''}`}>{(i.quantity||0).toLocaleString()}</td><td className="p-4 text-right text-slate-500">${(i.unitPrice||0).toFixed(2)}</td><td className="p-4 text-right font-bold text-emerald-700">${(i.total||0).toLocaleString()}</td><td className="p-4"><div className="flex justify-center gap-2"><button onClick={()=>{setEditingId(i.id); setFormData(i); setIsModalOpen(true)}} className="p-1 hover:bg-slate-100 rounded"><Edit2 className="w-4 h-4 text-indigo-500"/></button><button onClick={()=>handleDelete(i.id)} className="p-1 hover:bg-slate-100 rounded"><Trash2 className="w-4 h-4 text-red-500"/></button></div></td></tr>)}</tbody></table></div>
                    </>
                )}
                
                {isModalOpen && <div className="fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4"><div className="bg-white rounded-xl shadow-xl w-full max-w-md p-6 animate-fade-in-up"><h3 className="font-bold mb-4">{editingId?'Edit':'Add'} Material</h3><form onSubmit={handleSubmit} className="space-y-4"><div><label className="block text-sm">Category</label><select value={formData.category} onChange={e=>setFormData({...formData, category:e.target.value})} className="w-full border p-2 rounded">{categories.map(c=><option key={c} value={c}>{c}</option>)}</select></div><div><label className="block text-sm">Name</label><input type="text" value={formData.name} onChange={e=>setFormData({...formData, name:e.target.value})} className="w-full border p-2 rounded" required/></div><div className="grid grid-cols-2 gap-2"><div><label className="block text-sm">Date</label><input type="date" value={formData.date} onChange={e=>setFormData({...formData, date:e.target.value})} className="w-full border p-2 rounded" required/></div><div><label className="block text-sm">Qty</label><input type="number" value={formData.quantity} onChange={e=>setFormData({...formData, quantity:e.target.value})} className="w-full border p-2 rounded" required/></div></div><div><label className="block text-sm">Unit Price</label><input type="number" step="0.01" value={formData.unitPrice} onChange={e=>setFormData({...formData, unitPrice:e.target.value})} className="w-full border p-2 rounded" required/></div><div className="flex justify-end gap-2 pt-2"><button type="button" onClick={closeModal} className="px-4 py-2 border rounded">Cancel</button><button type="submit" className="px-4 py-2 bg-emerald-600 text-white rounded">Save</button></div></form></div></div>}
            </div>);
        };

        // Nursery Manager
        const NurseryManager = ({ records, setRecords, materials, setMaterials, onCalculateCost }) => {
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [viewMode, setViewMode] = useState('table');
            const [formData, setFormData] = useState({ date: new Date().toISOString().split('T')[0], crop: 'Iceberg Lettuce', variety: '', customVariety: '', seedCount: '', isCustomVariety: false, materialId: '' });
            const seedMaterials = useMemo(() => materials.filter(m => m.category === 'Seeds' && m.quantity > 0), [materials]);
            const selectedMaterial = useMemo(() => formData.materialId ? materials.find(m => m.id === formData.materialId || m.id === Number(formData.materialId)) : null, [formData.materialId, materials]);
            
            // Analytics
            const totalSeeded = useMemo(() => records.reduce((sum, r) => sum + (r.seedCount || 0), 0), [records]);
            const totalAvailable = useMemo(() => records.reduce((sum, r) => sum + (r.remainingCount || 0), 0), [records]);
            const utilizationRate = totalSeeded > 0 ? ((totalSeeded - totalAvailable) / totalSeeded * 100) : 0;
            const activeBatches = records.filter(r => r.remainingCount > 0);
            const avgCostPerSeedling = useMemo(() => { const withCost = records.filter(r => r.costPerSeedling > 0); return withCost.length > 0 ? withCost.reduce((sum, r) => sum + r.costPerSeedling, 0) / withCost.length : 0; }, [records]);
            const varietyDistribution = useMemo(() => { const byVariety = {}; records.forEach(r => { byVariety[r.variety] = (byVariety[r.variety] || 0) + (r.remainingCount || 0); }); return Object.entries(byVariety).filter(([,v]) => v > 0).map(([label, value]) => ({ label, value })).sort((a,b) => b.value - a.value); }, [records]);
            const batchComparison = useMemo(() => records.slice(0, 8).map(r => ({ label: r.variety?.substring(0, 8) || 'N/A', value: r.remainingCount || 0 })), [records]);
            
            const handleSubmit = async (e) => {
                e.preventDefault(); const count = Number(formData.seedCount); if (count < 0) return alert("Negative values not allowed");
                try {
                    if (editingId) { const oldRecord = records.find(r => r.id === editingId); const diff = count - oldRecord.seedCount; if (oldRecord.materialId) { const mat = materials.find(m => m.id === oldRecord.materialId); if (mat && diff > mat.quantity) return alert("Insufficient stock."); if(mat) await window.Firebase.updateDoc('materials', mat.id, { quantity: mat.quantity - diff }); } await window.Firebase.updateDoc('nurseryRecords', editingId, { ...formData, seedCount: count, remainingCount: oldRecord.remainingCount + diff }); }
                    else { if (!formData.isCustomVariety && formData.materialId) { const mat = materials.find(m => m.id === formData.materialId || m.id === Number(formData.materialId)); if (count > mat.quantity) return alert("Insufficient stock."); await window.Firebase.updateDoc('materials', mat.id, { quantity: mat.quantity - count }); } const variety = formData.isCustomVariety ? formData.customVariety : selectedMaterial?.name || formData.variety; await window.Firebase.addDoc('nurseryRecords', { ...formData, variety, seedCount: count, remainingCount: count, status: 'Seeded', materialId: formData.materialId || null }); }
                    closeModal();
                } catch (err) { console.error('Error saving nursery record:', err); alert('Error: ' + err.message); }
            };
            const handleDelete = async (r) => { if(window.confirm('Delete?')) { try { await window.Firebase.deleteDoc('nurseryRecords', r.id); if(r.materialId) { const mat = materials.find(m => m.id === r.materialId); if(mat) await window.Firebase.updateDoc('materials', mat.id, { quantity: mat.quantity + r.seedCount }); } } catch (err) { console.error('Error deleting:', err); alert('Error: ' + err.message); } } };
            const closeModal = () => { setIsModalOpen(false); setEditingId(null); setFormData({ date: new Date().toISOString().split('T')[0], crop: 'Iceberg Lettuce', variety: '', customVariety: '', seedCount: '', isCustomVariety: false, materialId: '' }); };
            
            return (<div className="space-y-6 animate-fade-in pb-20">
                <div className="flex justify-between items-center"><h2 className="text-2xl font-bold">Nursery Management</h2><div className="flex gap-2"><button onClick={() => setViewMode(viewMode === 'table' ? 'analytics' : 'table')} className="bg-white border px-4 py-2 rounded-lg text-sm hover:bg-slate-50">{viewMode === 'table' ? '📊 Analytics' : '📋 Table'}</button><button onClick={() => setIsModalOpen(true)} className="bg-emerald-600 text-white px-4 py-2 rounded-lg flex gap-2"><Plus className="w-4 h-4" /> New Sowing</button></div></div>
                
                {/* Summary Cards */}
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <MiniCard title="Active Batches" value={activeBatches.length} subtitle={`${records.length} total`} icon={Flower2} color="purple" />
                    <MiniCard title="Available Seedlings" value={totalAvailable.toLocaleString()} subtitle={`${totalSeeded.toLocaleString()} seeded`} icon={Sprout} color="emerald" />
                    <MiniCard title="Utilization Rate" value={`${utilizationRate.toFixed(1)}%`} subtitle="Seeds used" icon={BarChart3} color="blue" />
                    <MiniCard title="Avg Cost/Seedling" value={avgCostPerSeedling > 0 ? `$${avgCostPerSeedling.toFixed(4)}` : '--'} subtitle="With operations" icon={DollarSign} color="amber" />
                </div>
                
                {viewMode === 'analytics' ? (
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {/* Variety Distribution */}
                        <div className="bg-white rounded-xl border p-5 shadow-sm"><h4 className="font-bold text-slate-700 text-sm mb-4 flex items-center gap-2"><PieChart className="w-4 h-4 text-purple-500" /> Available by Variety</h4><SVGDonutChart data={varietyDistribution} showLegend size={140} /></div>
                        
                        {/* Batch Comparison */}
                        <div className="bg-white rounded-xl border p-5 shadow-sm"><h4 className="font-bold text-slate-700 text-sm mb-4 flex items-center gap-2"><BarChart3 className="w-4 h-4 text-emerald-500" /> Batch Availability</h4><SVGBarChart data={batchComparison} color="emerald" /></div>
                        
                        {/* Batch Performance */}
                        <div className="bg-white rounded-xl border p-5 shadow-sm lg:col-span-2"><h4 className="font-bold text-slate-700 text-sm mb-4">Batch Performance Comparison</h4><div className="overflow-x-auto"><table className="w-full text-xs"><thead className="bg-slate-50 border-b"><tr><th className="p-2 text-left">Variety</th><th className="p-2 text-right">Seeded</th><th className="p-2 text-right">Available</th><th className="p-2 text-right">Used</th><th className="p-2">Utilization</th><th className="p-2 text-right">Cost/Seed</th></tr></thead><tbody>{records.slice(0, 10).map(r => { const used = r.seedCount - r.remainingCount; const util = r.seedCount > 0 ? (used / r.seedCount * 100) : 0; return (<tr key={r.id} className="border-b hover:bg-slate-50"><td className="p-2 font-medium">{r.variety}</td><td className="p-2 text-right">{r.seedCount?.toLocaleString()}</td><td className="p-2 text-right font-bold text-emerald-600">{r.remainingCount?.toLocaleString()}</td><td className="p-2 text-right text-slate-500">{used.toLocaleString()}</td><td className="p-2"><ProgressBar value={util} max={100} color={util > 80 ? 'emerald' : util > 50 ? 'blue' : 'amber'} showPercent={false} /></td><td className="p-2 text-right">{r.costPerSeedling ? `$${r.costPerSeedling.toFixed(4)}` : '--'}</td></tr>); })}</tbody></table></div></div>
                    </div>
                ) : (
                    <div className="bg-white rounded-xl border overflow-hidden"><table className="w-full text-sm text-left"><thead className="bg-slate-50 border-b"><tr><th className="p-4">Date</th><th className="p-4">Variety</th><th className="p-4 text-right">Seeded</th><th className="p-4 text-right">Available</th><th className="p-4">Utilization</th><th className="p-4 text-right">Cost/Seed</th><th className="p-4 text-center">Actions</th></tr></thead><tbody>{records.map(r => { const util = r.seedCount > 0 ? ((r.seedCount - r.remainingCount) / r.seedCount * 100) : 0; return (<tr key={r.id} className={`border-b hover:bg-slate-50 ${r.remainingCount === 0 ? 'opacity-50' : ''}`}><td className="p-4 text-slate-500">{r.date}</td><td className="p-4 font-bold">{r.variety}</td><td className="p-4 text-right">{(r.seedCount||0).toLocaleString()}</td><td className="p-4 text-right font-bold text-emerald-700">{(r.remainingCount||0).toLocaleString()}</td><td className="p-4 w-32"><ProgressBar value={util} max={100} color={util > 80 ? 'emerald' : 'blue'} showPercent /></td><td className="p-4 text-right">{r.costPerSeedling ? `$${Number(r.costPerSeedling).toFixed(4)}` : '-'}</td><td className="p-4"><div className="flex justify-center gap-1"><button onClick={() => onCalculateCost(r.id, r.date, new Date().toISOString().split('T')[0])} title="Calculate Cost" className="p-1 hover:bg-green-50 rounded"><DollarSign className="w-4 h-4 text-green-600"/></button><button onClick={()=>{setEditingId(r.id); setFormData({...r, isCustomVariety:!r.materialId, materialId: r.materialId||''}); setIsModalOpen(true)}} className="p-1 hover:bg-slate-100 rounded"><Edit2 className="w-4 h-4 text-indigo-500"/></button><button onClick={()=>handleDelete(r)} className="p-1 hover:bg-slate-100 rounded"><Trash2 className="w-4 h-4 text-red-500"/></button></div></td></tr>); })}</tbody></table></div>
                )}
                
                {isModalOpen && <div className="fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4"><div className="bg-white rounded-xl shadow-xl w-full max-w-md p-6 animate-fade-in-up"><h3 className="font-bold mb-4">{editingId?'Edit':'New'} Sowing</h3><form onSubmit={handleSubmit} className="space-y-4"><div><label className="block text-sm">Date</label><input type="date" value={formData.date} onChange={e=>setFormData({...formData, date:e.target.value})} className="w-full border p-2 rounded" required/></div>{!editingId && <div><div className="flex gap-4 mb-2 text-sm"><label className="flex items-center gap-2"><input type="radio" checked={!formData.isCustomVariety} onChange={()=>setFormData({...formData, isCustomVariety:false})}/> Inventory</label><label className="flex items-center gap-2"><input type="radio" checked={formData.isCustomVariety} onChange={()=>setFormData({...formData, isCustomVariety:true})}/> Custom</label></div>{!formData.isCustomVariety ? <select value={formData.materialId} onChange={e=>setFormData({...formData, materialId:e.target.value})} className="w-full border p-2 rounded" required><option value="">Select Seed...</option>{seedMaterials.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select> : <input type="text" placeholder="Variety Name" value={formData.customVariety} onChange={e=>setFormData({...formData, customVariety:e.target.value})} className="w-full border p-2 rounded" required/>}</div>}{selectedMaterial && !editingId && !formData.isCustomVariety && <div className="bg-blue-50 p-2 rounded text-xs text-blue-800"><p>Purchased: {selectedMaterial.date}</p><p>Stock: {selectedMaterial.quantity.toLocaleString()}</p></div>}<div><label className="block text-sm">Seed Count</label><input type="number" value={formData.seedCount} onChange={e=>setFormData({...formData, seedCount:e.target.value})} className="w-full border p-2 rounded" required/></div><div className="flex justify-end gap-2 pt-2"><button type="button" onClick={closeModal} className="px-4 py-2 border rounded">Cancel</button><button type="submit" className="px-4 py-2 bg-emerald-600 text-white rounded">Save</button></div></form></div></div>}
            </div>);
        };

        // Planting Manager
        const PlantingManager = ({ plots, plantingData, setPlantingData, plantingRecords, setPlantingRecords, nurseryRecords, setNurseryRecords, plotStates, setPlotStates }) => {
            const [selectedPlot, setSelectedPlot] = useState(null);
            const [formData, setFormData] = useState({ date: new Date().toISOString().split('T')[0], selectedBatchId: '', quantity: '', markFullyPlanted: false });
            const [isEditOpen, setIsEditOpen] = useState(false);
            const [editLog, setEditLog] = useState(null);
            const [editForm, setEditForm] = useState({ date: '', quantity: 0, markFullyPlanted: false });
            const availableBatches = useMemo(() => nurseryRecords.filter(r => r.remainingCount > 0), [nurseryRecords]);
            const getPlotState = (key) => plotStates[key] || { status: 'empty', cycle: 0, year: new Date().getFullYear() };
            const handlePlotClick = (plot) => { const key = `${plot.type === 'Greenhouse' ? 'greenhouse' : 'field'}-${plot.id}`; const state = getPlotState(key); if (state.status === 'fully_planted') return alert("Plot fully planted."); setSelectedPlot({ ...plot, key, state }); setFormData({ date: new Date().toISOString().split('T')[0], selectedBatchId: '', quantity: '', markFullyPlanted: false }); };
            const handleSave = async (e) => {
                e.preventDefault();
                const qty = Number(formData.quantity);
                const nurseryBatch = nurseryRecords.find(r => r.id === formData.selectedBatchId || r.id === Number(formData.selectedBatchId));
                if (!nurseryBatch || qty <= 0 || qty > nurseryBatch.remainingCount) return alert("Invalid Quantity");
                let { cycle, year, status } = selectedPlot.state;
                const currentYear = new Date().getFullYear();
                if (status === 'empty' || status === 'fully_harvested') { year = currentYear > year ? currentYear : year; cycle = currentYear > selectedPlot.state.year ? 1 : (cycle || 0) + 1; }
                if (cycle === 0) cycle = 1;
                try {
                    await window.Firebase.updateDoc('nurseryRecords', nurseryBatch.id, { remainingCount: nurseryBatch.remainingCount - qty });
                    const newBatch = { date: formData.date, variety: nurseryBatch.variety, quantity: qty, initialQuantity: qty, nurseryBatchId: nurseryBatch.id, status: 'growing', cycle, year };
                    const plantingDoc = await window.Firebase.addDoc('plantingRecords', { ...newBatch, location: `${selectedPlot.type} ${selectedPlot.id}`, plotKey: selectedPlot.key });
                    const existingBatches = plantingData[selectedPlot.key] || [];
                    await window.Firebase.setDoc('plantingData', selectedPlot.key, { batches: [...existingBatches, { ...newBatch, id: plantingDoc.id }] }, { merge: true });
                    await window.Firebase.setDoc('plotStates', selectedPlot.key, { status: formData.markFullyPlanted ? 'fully_planted' : 'growing', cycle, year }, { merge: true });
                    setSelectedPlot(null);
                } catch (err) { console.error('Error saving planting:', err); alert('Error: ' + err.message); }
            };
            const handleUpdateLog = async (e) => { e.preventDefault(); const newQty = Number(editForm.quantity); const state = getPlotState(editLog.plotKey); if (editLog.cycle !== state.cycle || editLog.year !== state.year) return alert("Old cycle record."); try { const diff = newQty - editLog.quantity; const nb = nurseryRecords.find(r => r.id === editLog.nurseryBatchId); if (nb && diff > nb.remainingCount) return alert("Insufficient seedlings"); if (nb) await window.Firebase.updateDoc('nurseryRecords', nb.id, { remainingCount: nb.remainingCount - diff }); await window.Firebase.updateDoc('plantingRecords', editLog.id, { date: editForm.date, quantity: newQty }); const batches = (plantingData[editLog.plotKey] || []).map(b => b.id === editLog.id ? { ...b, quantity: newQty, initialQuantity: newQty, date: editForm.date } : b); await window.Firebase.setDoc('plantingData', editLog.plotKey, { batches }, { merge: true }); if (editForm.markFullyPlanted !== (state.status === 'fully_planted')) await window.Firebase.setDoc('plotStates', editLog.plotKey, { ...state, status: editForm.markFullyPlanted ? 'fully_planted' : 'growing' }, { merge: true }); setIsEditOpen(false); } catch (err) { console.error('Error updating:', err); alert('Error: ' + err.message); } };
            const handleDeleteLog = async (log) => { if(!window.confirm("Delete?")) return; try { const state = getPlotState(log.plotKey); if (log.cycle === state.cycle && log.year === state.year) { const nb = nurseryRecords.find(r => r.id === log.nurseryBatchId); if (nb) await window.Firebase.updateDoc('nurseryRecords', nb.id, { remainingCount: nb.remainingCount + log.quantity }); const rem = (plantingData[log.plotKey] || []).filter(b => b.id !== log.id); await window.Firebase.setDoc('plantingData', log.plotKey, { batches: rem }, { merge: true }); if (rem.length === 0) await window.Firebase.setDoc('plotStates', log.plotKey, { ...state, status: 'empty' }, { merge: true }); } await window.Firebase.deleteDoc('plantingRecords', log.id); } catch (err) { console.error('Error deleting:', err); alert('Error: ' + err.message); } };
            const PlotCard = ({ plot }) => { const key = `${plot.type === 'Greenhouse' ? 'greenhouse' : 'field'}-${plot.id}`; const state = getPlotState(key); let color = 'bg-white border-slate-200'; if (state.status === 'fully_harvested') color = 'bg-red-50 border-red-200'; else if (state.status === 'fully_planted') color = 'bg-emerald-100 border-emerald-600'; else if (state.status === 'growing') color = 'bg-emerald-50 border-emerald-400'; return (<button onClick={() => handlePlotClick(plot)} className={`p-3 rounded-xl border-2 h-24 flex flex-col justify-between text-left transition-all ${color} relative`}><div className="flex justify-between w-full"><span className="font-bold text-sm text-slate-700">{plot.name}</span>{state.status === 'fully_planted' && <Lock className="w-4 h-4 text-emerald-800" />}</div><div className="text-xs">{state.status === 'empty' ? <span className="text-slate-400">Ready</span> : <span className="text-emerald-800 font-bold">Cycle {state.cycle}</span>}</div></button>); };
            // Analytics
            const totalPlanted = useMemo(() => plantingRecords.reduce((sum, r) => sum + (r.quantity || 0), 0), [plantingRecords]);
            const ghStats = useMemo(() => { const gh = plots.filter(p => p.type === 'Greenhouse'); const active = gh.filter(p => ['growing', 'fully_planted'].includes(getPlotState(`greenhouse-${p.id}`)?.status)); return { total: gh.length, active: active.length }; }, [plots, plotStates]);
            const fieldStats = useMemo(() => { const f = plots.filter(p => p.type === 'Open Field'); const active = f.filter(p => ['growing', 'fully_planted'].includes(getPlotState(`field-${p.id}`)?.status)); return { total: f.length, active: active.length }; }, [plots, plotStates]);
            const varietyDistribution = useMemo(() => { const byVariety = {}; plantingRecords.forEach(r => { byVariety[r.variety] = (byVariety[r.variety] || 0) + (r.quantity || 0); }); return Object.entries(byVariety).map(([label, value]) => ({ label, value })).sort((a,b) => b.value - a.value).slice(0, 5); }, [plantingRecords]);
            
            return (<div className="space-y-6 animate-fade-in pb-20">
                <h2 className="text-2xl font-bold">Planting Management</h2>
                
                {/* Stats */}
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <MiniCard title="Total Planted" value={totalPlanted.toLocaleString()} subtitle="All time" icon={Sprout} color="emerald" />
                    <MiniCard title="Greenhouses" value={`${ghStats.active}/${ghStats.total}`} subtitle={`${((ghStats.active/ghStats.total)*100||0).toFixed(0)}% utilized`} icon={Warehouse} color="blue" />
                    <MiniCard title="Open Fields" value={`${fieldStats.active}/${fieldStats.total}`} subtitle={`${((fieldStats.active/fieldStats.total)*100||0).toFixed(0)}% utilized`} icon={LayoutGrid} color="amber" />
                    <MiniCard title="Available Batches" value={availableBatches.length} subtitle={`${availableBatches.reduce((s,b) => s + b.remainingCount, 0).toLocaleString()} seedlings`} icon={Flower2} color="purple" />
                </div>
                
                {/* Plot Legend */}

                    if (editingId) { const oldRec = irrigationRecords.find(r => r.id === editingId); if (oldRec) { const oldMat = materials.find(m => m.id === oldRec.materialId); if (oldMat) await window.Firebase.updateDoc('materials', oldMat.id, { quantity: oldMat.quantity + Number(oldRec.quantity) }); } }
                    // Deduct new quantity
                    if (mat && mat.quantity < qty) return alert("Insufficient stock.");
                    if (mat) await window.Firebase.updateDoc('materials', mat.id, { quantity: mat.quantity - qty });
                    const record = { unitId: activeUnit, unitName: unit.name, date: formData.date, materialId: mat.id, materialName: mat.name, quantity: qty, water: Number(formData.water), appliedTo: unit.connectedPlots || [] };
                    if (editingId) await window.Firebase.updateDoc('irrigationRecords', editingId, record); else await window.Firebase.addDoc('irrigationRecords', record);
                    setIsEntryModalOpen(false);
                } catch (err) { console.error('Error saving irrigation:', err); alert('Error: ' + err.message); }
            };
            const toggleLocation = (id) => setSelectedLocations(p => p.includes(id) ? p.filter(x => x !== id) : [...p, id]);
            const handleDeleteRecord = async (recId) => { if(!window.confirm("Delete? Stock will be restored.")) return; try { const rec = irrigationRecords.find(r => r.id === recId); if(rec) { const mat = materials.find(m => m.id === rec.materialId); if(mat) await window.Firebase.updateDoc('materials', mat.id, { quantity: mat.quantity + Number(rec.quantity) }); } await window.Firebase.deleteDoc('irrigationRecords', recId); } catch (err) { console.error('Error deleting:', err); alert('Error: ' + err.message); } };
            const handleAddUnit = async () => { try { 
                // Extract numbers from existing unit names
                const existingNumbers = irrigationUnits.map(u => {
                    const match = u.name.match(/\d+/);
                    return match ? parseInt(match[0]) : 999;
                }).sort((a, b) => a - b);
                // Find the first free number starting from 1
                let nextNumber = 1;
                for (let num of existingNumbers) {
                    if (nextNumber === num) {
                        nextNumber++;
                    } else {
                        break;
                    }
                }
                await window.Firebase.addDoc('irrigationUnits', { name: `Unit ${nextNumber}`, connectedPlots: [] }); 
            } catch (err) { console.error('Error adding unit:', err); alert('Error: ' + err.message); } };
            const handleDeleteUnit = async (unitId) => { if(!window.confirm("Delete this irrigation unit? Associated records will remain but will no longer be linked to a unit.")) return; try { await window.Firebase.deleteDoc('irrigationUnits', unitId); } catch (err) { console.error('Error deleting unit:', err); alert('Error: ' + err.message); } };
            const openBlockHistory = (locId) => { const records = irrigationRecords.filter(r => r.appliedTo?.includes(locId)).sort((a,b)=>new Date(b.date)-new Date(a.date)); const totalWater = records.reduce((acc, r) => acc + Number(r.water) / (r.appliedTo?.length || 1), 0); const matUsage = {}; records.forEach(r => { const perPlotQty = Number(r.quantity) / (r.appliedTo?.length || 1); matUsage[r.materialName] = (matUsage[r.materialName] || 0) + perPlotQty; }); const donutData = Object.entries(matUsage).map(([name, val]) => ({ label: name, value: Math.round(val * 100) / 100 })); const waterByDate = {}; records.forEach(r => { const perPlotWater = Number(r.water) / (r.appliedTo?.length || 1); waterByDate[r.date] = (waterByDate[r.date] || 0) + perPlotWater; }); const waterTrend = Object.keys(waterByDate).sort().slice(-7).map(date => ({ label: date.split('-').slice(1).join('/'), value: Math.round(waterByDate[date] * 100) / 100 })); const mostUsedMat = Object.entries(matUsage).sort((a,b)=>b[1]-a[1])[0]?.[0] || 'N/A'; setSelectedBlockHistory({ id: locId, records: records.map(r => ({...r, waterPerPlot: Math.round(Number(r.water) / (r.appliedTo?.length || 1) * 100) / 100, qtyPerPlot: Math.round(Number(r.quantity) / (r.appliedTo?.length || 1) * 100) / 100 })), stats: { totalWater: Math.round(totalWater * 100) / 100, count: records.length, lastDate: records[0]?.date || 'Never', mostUsedMat }, charts: { donutData, waterTrend } }); };
            const renderLocationSection = (title, typeFilter, isSelectionMode = false) => (<div className="mb-4"><h4 className="text-xs font-bold text-slate-500 uppercase mb-2 border-b pb-1">{title}</h4><div className={`grid ${isSelectionMode ? 'grid-cols-3 sm:grid-cols-4' : 'grid-cols-2 md:grid-cols-5 lg:grid-cols-8'} gap-2`}>{locations.filter(l => l.type === typeFilter).map(loc => { if (isSelectionMode) { return <button key={loc.id} onClick={() => toggleLocation(loc.id)} className={`p-2 text-xs font-bold rounded border ${selectedLocations.includes(loc.id) ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50 text-slate-600 border-slate-200'}`}>{loc.name}</button>; } else { return <button key={loc.id} onClick={() => openBlockHistory(loc.id)} className="p-2 rounded border text-xs font-bold truncate transition-all hover:scale-105 bg-slate-50 border-slate-200 hover:bg-slate-100">{loc.name}</button>; } })}</div></div>);
            // Analytics
            const totalWater = useMemo(() => irrigationRecords.reduce((sum, r) => sum + Number(r.water || 0), 0), [irrigationRecords]);
            const totalConnectedPlots = useMemo(() => irrigationUnits.reduce((sum, u) => sum + (u.connectedPlots?.length || 0), 0), [irrigationUnits]);
            const activeUnits = irrigationUnits.filter(u => u.connectedPlots?.length > 0).length;
            return (<div className="space-y-6 animate-fade-in pb-20"><div className="flex justify-between items-center"><h2 className="text-2xl font-bold">Irrigation & Fertigation</h2><div className="flex gap-2">{view === 'units' && <button onClick={handleAddUnit} className="bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700 flex items-center gap-2"><Plus className="w-4 h-4" />Add Unit</button>}<button onClick={() => setView(view === 'units' ? 'history' : 'units')} className="bg-white border border-slate-300 px-4 py-2 rounded-lg hover:bg-slate-50">{view === 'units' ? '📊 View Map' : '← Back to Units'}</button></div></div>
            {/* Stats */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4"><MiniCard title="Total Water" value={`${totalWater.toLocaleString()} L`} subtitle={`${irrigationRecords.length} events`} icon={Droplets} color="cyan" /><MiniCard title="Active Units" value={`${activeUnits}/${irrigationUnits.length}`} subtitle="Units connected" icon={Settings} color="blue" /><MiniCard title="Plots Connected" value={totalConnectedPlots} subtitle="Total coverage" icon={LayoutGrid} color="emerald" /><MiniCard title="Available Inputs" value={validMaterials.length} subtitle="Fertilizers ready" icon={Package} color="purple" /></div>
