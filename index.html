                    // Sort units by number extracted from name
                    const sorted = data.sort((a, b) => {
                        const numA = parseInt(a.name.match(/\d+/)?.[0] || '999');
                        const numB = parseInt(b.name.match(/\d+/)?.[0] || '999');
                        return numA - numB;
                    });
                    setIrrigationUnits(sorted);
                }));
                
                // Plot states
                unsubs.push(window.Firebase.onSnapshot('plotStates', (data) => {
                    const obj = {};
                    data.forEach(item => { obj[item.id] = item; });
                    setPlotStates(obj);
                }));
                
                // Planting data (batches per plot)
                unsubs.push(window.Firebase.onSnapshot('plantingData', (data) => {
                    const obj = {};
                    data.forEach(item => { obj[item.id] = item.batches || []; });
                    setPlantingData(obj);
                }));
                
                // Plots
                unsubs.push(window.Firebase.onSnapshot('plots', (data) => {
                    // Sort plots by number extracted from plotId or name
                    // Keep original Firestore document ID in 'id' field for deletion operations
                    // Use plotId or extracted number for display/plotKey construction
                    const sorted = data.map(p => {
                        // Preserve the Firestore document ID (comes first in the object from onSnapshot)
                        const firestoreDocId = p.id; // This is the Firestore document ID
                        // Extract display ID from plotId or name, but don't use p.id for this
                        const displayId = p.plotId || parseInt(p.name?.match(/\d+/)?.[0]);
                        return { 
                            ...p, 
                            id: firestoreDocId, // Force id to be the Firestore document ID (string)
                            plotDisplayId: (displayId && !isNaN(displayId)) ? displayId : firestoreDocId 
                        };
                    }).sort((a, b) => {
                        const numA = parseInt(a.plotId || a.name?.match(/\d+/)?.[0] || a.plotDisplayId || '999');
                        const numB = parseInt(b.plotId || b.name?.match(/\d+/)?.[0] || b.plotDisplayId || '999');
                        return numA - numB;
                    });
                    setPlots(sorted);
                    setDataLoading(false);
                }));
                
                return () => unsubs.forEach(u => u && u());
            }, [user]);
            const handleAddPlot = async (type) => {
                try {
                    // Extract numbers from existing plots of this type
                    const existingOfType = plots.filter(p => p.type === type);
                    const existingNumbers = existingOfType.map(p => {
                        const num = p.plotId || parseInt(p.name?.match(/\d+/)?.[0]) || parseInt(p.id);
                        return isNaN(num) ? 999 : num;
                    }).sort((a, b) => a - b);
                    
                    // Find the first free number starting from 1
                    let nextNumber = 1;
                    for (let num of existingNumbers) {
                        if (nextNumber === num) {
                            nextNumber++;
                        } else {
                            break;
                        }
                    }
                    
                    const prefix = type === 'Greenhouse' ? 'GH' : type === 'Open Field' ? 'O.F' : 'Nursery';
                    await window.Firebase.addDoc('plots', { plotId: nextNumber, type, name: `${prefix} ${nextNumber}` });
                } catch (err) {
                    console.error('Error adding plot:', err);
                    alert('Error: ' + err.message);
                }
            };
            const handleDeletePlot = async (plotId) => {
                if (!window.confirm("Delete this plot? Associated records will remain but the plot will no longer be visible.")) return;
                try {
                    // Ensure plotId is a string (Firestore document ID)
                    const docId = String(plotId);
                    await window.Firebase.deleteDoc('plots', docId);
                } catch (err) {
                    console.error('Error deleting plot:', err);
                    alert('Error: ' + err.message);
                }
            };
            const calculateSeedlingCost = (seedBatchId, sowingDate, plantingDate) => {
                const batch = nurseryRecords.find(r => r.id === seedBatchId);
                if (!batch) return 0;
                let unitSeedCost = 0;
                if (batch.materialId) { const seedMat = materials.find(m => m.id === batch.materialId); unitSeedCost = seedMat ? seedMat.unitPrice : 0; }
                let accumulatedWaterCost = 0;
                let accumulatedMaterialCost = 0;
                const waterMat = materials.find(m => m.category === 'Water');
                const waterPrice = waterMat ? waterMat.unitPrice : 0;
                const start = new Date(sowingDate);
                const end = new Date(plantingDate);
                for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                    const dayStr = d.toISOString().split('T')[0];
                    const sownBatches = nurseryRecords.filter(n => new Date(n.date) <= d);
                    const totalSown = sownBatches.reduce((sum, n) => sum + n.seedCount, 0);
                    const plantedRecords = plantingRecords.filter(p => new Date(p.date) < d);
                    const totalPlanted = plantedRecords.reduce((sum, p) => sum + p.quantity, 0);
                    const population = Math.max(1, totalSown - totalPlanted);
                    const dailyIrrigations = irrigationRecords.filter(r => r.date === dayStr && r.appliedTo.some(loc => loc.includes('nursery')));
                    let dailyWaterCost = 0;
                    let dailyIrrMatCost = 0;
                    dailyIrrigations.forEach(r => { dailyWaterCost += (Number(r.water) * waterPrice); const mat = materials.find(m => m.id === r.materialId); dailyIrrMatCost += (Number(r.quantity) * (mat ? mat.unitPrice : 0)); });
                    const dailySprays = sprayingRecords.filter(r => r.date === dayStr && r.locations.some(loc => loc.includes('nursery')));
                    let dailySprayMatCost = 0;
                    dailySprays.forEach(r => { dailyWaterCost += (Number(r.water) * waterPrice); r.items.forEach(item => { const mat = materials.find(m => m.id === Number(item.materialId)); dailySprayMatCost += (Number(item.quantity) * (mat ? mat.unitPrice : 0)); }); });
                    accumulatedWaterCost += (dailyWaterCost / population);
                    accumulatedMaterialCost += ((dailyIrrMatCost + dailySprayMatCost) / population);
                }
                const totalCost = unitSeedCost + accumulatedWaterCost + accumulatedMaterialCost;
                // Persist to Firestore
                window.Firebase.updateDoc('nurseryRecords', seedBatchId, { costPerSeedling: totalCost, lastCostCalc: plantingDate }).catch(err => console.error('Error updating cost:', err));
                return totalCost;
            };
            const calculateCycleOperationalCost = (plotKey, startDate, endDate) => { const breakdown = calculateCycleBreakdown(plotKey, startDate, endDate); return breakdown.water + breakdown.irrMat + breakdown.spray; };
            const calculateCycleBreakdown = (plotKey, startDate, endDate) => {
                const start = new Date(startDate);
                const end = new Date(endDate);
                const waterMat = materials.find(m => m.category === 'Water');
                const waterPrice = waterMat ? waterMat.unitPrice : 0;
                let waterShare = 0;
                let irrMatShare = 0;
                let sprayShare = 0;
                irrigationRecords.forEach(r => { const rDate = new Date(r.date); if (rDate >= start && rDate <= end && r.appliedTo.includes(plotKey)) { const mat = materials.find(m => m.id === r.materialId); const matCost = (Number(r.quantity) * (mat ? mat.unitPrice : 0)); const waterCost = (Number(r.water) * waterPrice); const plotsCount = r.appliedTo.length || 1; waterShare += (waterCost / plotsCount); irrMatShare += (matCost / plotsCount); } });
                sprayingRecords.forEach(r => { const rDate = new Date(r.date); if (rDate >= start && rDate <= end && r.locations.includes(plotKey)) { let eventMatCost = 0; r.items.forEach(item => { const mat = materials.find(m => m.id === Number(item.materialId)); eventMatCost += (Number(item.quantity) * (mat ? mat.unitPrice : 0)); }); const waterCost = (Number(r.water) * waterPrice); const plotsCount = r.locations.length || 1; waterShare += (waterCost / plotsCount); sprayShare += (eventMatCost / plotsCount); } });
                return { water: waterShare, irrMat: irrMatShare, spray: sprayShare };
            };
            const stats = { nurseries: nurseryRecords.filter(r => r.remainingCount > 0).length, greenhouses: Object.keys(plotStates).filter(k => k.startsWith('greenhouse') && ['growing', 'fully_planted'].includes(plotStates[k]?.status)).length, openFields: Object.keys(plotStates).filter(k => k.startsWith('field') && ['growing', 'fully_planted'].includes(plotStates[k]?.status)).length };
            const handleLogout = async () => { try { await window.Firebase.signOut(); } catch (e) { console.error(e); } };
            
            const renderContent = () => {
                switch (currentView) {
                    case 'dashboard': return <Dashboard materials={materials} nurseryRecords={nurseryRecords} plantingRecords={plantingRecords} harvestRecords={harvestRecords} sprayingRecords={sprayingRecords} irrigationRecords={irrigationRecords} plotStates={plotStates} plantingData={plantingData} />;
                    case 'materials': return <MaterialsManager materials={materials} setMaterials={setMaterials} />;
                    case 'nursery': return <NurseryManager records={nurseryRecords} setRecords={setNurseryRecords} materials={materials} setMaterials={setMaterials} onCalculateCost={calculateSeedlingCost} />;
                    case 'planting': return <PlantingManager plots={plots} plantingData={plantingData} setPlantingData={setPlantingData} plantingRecords={plantingRecords} setPlantingRecords={setPlantingRecords} nurseryRecords={nurseryRecords} setNurseryRecords={setNurseryRecords} plotStates={plotStates} setPlotStates={setPlotStates} />;
                    case 'harvesting': return <HarvestingManager plots={plots} plantingData={plantingData} setPlantingData={setPlantingData} harvestRecords={harvestRecords} setHarvestRecords={setHarvestRecords} plotStates={plotStates} setPlotStates={setPlotStates} plantingRecords={plantingRecords} materials={materials} setMaterials={setMaterials} onCalculateCycleCost={calculateCycleOperationalCost} />;
                    case 'spraying': return <SprayingManager plots={plots} materials={materials} setMaterials={setMaterials} sprayingRecords={sprayingRecords} setSprayingRecords={setSprayingRecords} />;
                    case 'irrigation': return <IrrigationManager plots={plots} materials={materials} setMaterials={setMaterials} irrigationUnits={irrigationUnits} setIrrigationUnits={setIrrigationUnits} irrigationRecords={irrigationRecords} setIrrigationRecords={setIrrigationRecords} />;
                    case 'statistical': return <StatisticalDataManager plots={plots} addPlot={handleAddPlot} deletePlot={handleDeletePlot} plantingRecords={plantingRecords} harvestRecords={harvestRecords} materials={materials} getCycleBreakdown={calculateCycleBreakdown} nurseryRecords={nurseryRecords} sprayingRecords={sprayingRecords} irrigationRecords={irrigationRecords} />;
                    default: return <div className="p-10 text-center text-slate-400">Under Construction</div>;
                }
            };
            const NavItem = ({ id, icon: Icon, label }) => (<button onClick={() => setCurrentView(id)} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg transition-colors ${currentView === id ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}><Icon className="w-5 h-5" />{isSidebarOpen && <span className="font-medium">{label}</span>}</button>);
            if (authLoading) return <div className="flex items-center justify-center h-screen bg-slate-50"><div className="text-center"><div className="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-600 mx-auto mb-4"></div><p className="text-slate-600">Loading...</p></div></div>;
            if (!user) return <LoginScreen />;
            if (dataLoading) return <div className="flex items-center justify-center h-screen bg-slate-50"><div className="text-center"><div className="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-600 mx-auto mb-4"></div><p className="text-slate-600">Loading farm data...</p></div></div>;
            return (<div className="flex h-screen bg-slate-50 overflow-hidden"><aside className={`${isSidebarOpen ? 'w-64' : 'w-20'} bg-slate-900 transition-all duration-300 flex flex-col shadow-xl z-20`}><div className="p-4 flex items-center justify-between border-b border-slate-800">{isSidebarOpen ? <div className="flex items-center space-x-2 text-emerald-400 font-bold text-xl"><Sprout className="w-8 h-8" /><span>GreenLeaf</span></div> : <div className="w-full flex justify-center"><Sprout className="w-8 h-8 text-emerald-400" /></div>}<button onClick={() => setSidebarOpen(!isSidebarOpen)} className="text-slate-400 hover:text-white"><Menu className="w-5 h-5" /></button></div><nav className="flex-1 py-6 px-3 space-y-2 overflow-y-auto"><NavItem id="dashboard" icon={LayoutGrid} label="Dashboard" /><NavItem id="statistical" icon={PieChart} label="Statistical Data" /><NavItem id="materials" icon={Package} label="Materials" /><NavItem id="nursery" icon={Flower2} label="Nursery" /><NavItem id="planting" icon={Sprout} label="Planting" /><NavItem id="harvesting" icon={Tractor} label="Harvesting" /><NavItem id="spraying" icon={Droplets} label="Spraying" /><NavItem id="irrigation" icon={Settings} label="Irrigation" /></nav><div className="p-4 border-t border-slate-800">{isSidebarOpen && <div className="mb-3 px-2"><p className="text-xs text-slate-500 truncate">{user.email}</p></div>}<button onClick={handleLogout} className="w-full flex items-center justify-center space-x-2 px-4 py-2 bg-slate-800 text-slate-400 rounded-lg hover:bg-slate-700 hover:text-white"><X className="w-4 h-4" />{isSidebarOpen && <span className="text-sm">Logout</span>}</button></div></aside><main className="flex-1 flex flex-col overflow-hidden relative"><header className="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shadow-sm z-10"><h1 className="text-xl font-bold text-slate-800 capitalize">{currentView}</h1></header><div className="flex-1 overflow-auto p-8 relative">{renderContent()}</div></main></div>);
        };
        function startApp() { const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />); }
        if (window.firebaseReady) startApp(); else window.addEventListener('firebase-ready', startApp);
    </script>
</body>
</html>
